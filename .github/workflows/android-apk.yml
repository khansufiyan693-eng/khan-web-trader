name: Build KHAN AI TRADER V22 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Install required Android SDK packages
      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 5. Check original V22 files
      - name: Verify V22 Source Files
        run: |
          set -e

          for file in \
            AndroidManifest.xml \
            MainActivity.java \
            build.gradle \
            settings.gradle \
            gradle.properties \
            index.html \
            persistence.js \
            styles.xml \
            backup_rules.xml \
            data_extraction_rules.xml
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi
          done

          echo "All required V22 files found."

      # 6. Create Android folder structure
      - name: Prepare Android Project
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/khanaitrader/app

          cp AndroidManifest.xml app/src/main/
          cp MainActivity.java app/src/main/java/com/khanaitrader/app/
          cp index.html app/src/main/assets/
          cp persistence.js app/src/main/assets/

          cp styles.xml app/src/main/res/values/
          cp backup_rules.xml app/src/main/res/xml/
          cp data_extraction_rules.xml app/src/main/res/xml/

          echo "Android project folders prepared."

      # 7. Create Android application Gradle file
      - name: Create App Gradle Configuration
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.khanaitrader.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.khanaitrader.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 22
                  versionName '22.0'
              }
          }
          EOF

      # 8. Setup Gradle
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 9. Build APK
      - name: Build KHAN AI TRADER APK
        run: |
          gradle --no-daemon clean :app:assembleDebug

      # 10. Verify APK
      - name: Verify APK File
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          ls -lh "$APK"
          echo "APK BUILD SUCCESSFUL"

      # 11. Upload installable APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KHAN-AI-TRADER-V22-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
