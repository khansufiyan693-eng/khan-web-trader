<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHAN AI TRADER - LIVE</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #0B0E14; color: #FFF; padding-bottom: 70px; }
        .top { background: #181D27; padding: 14px; border-bottom: 1px solid #2B3139; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .cap { color: #0ECB81; font-weight: bold; font-size: 16px; }
        .pnl { font-weight: bold; font-size: 14px; }
        .up { color: #0ECB81; }
        .down { color: #F6465D; }
        
        .tabs { display: flex; background: #151A24; border-bottom: 1px solid #2B3139; }
        .tab { flex: 1; padding: 12px; text-align: center; font-weight: bold; font-size: 13px; color: #848E9C; cursor: pointer; }
        .tab.active { color: #3861FB; border-bottom: 3px solid #3861FB; background: #181D27; }

        .box { padding: 12px; }
        .card { background: #181D27; border: 1px solid #2B3139; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .row { display: flex; justify-content: space-between; align-items: center; }
        
        button { border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .btn-buy { background: #0ECB81; color: #000; }
        .btn-sell { background: #F6465D; color: #FFF; }
        .btn-algo { background: #3861FB; color: #FFF; }
        .btn-gray { background: #2B3139; color: #FFF; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99; align-items: center; justify-content: center; padding: 15px; }
        .modal-inner { background: #181D27; border: 1px solid #3861FB; border-radius: 10px; padding: 18px; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #0B0E14; border: 1px solid #2B3139; color: #FFF; border-radius: 6px; font-size: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="top">
    <div>
        <div style="font-size:11px; color:#848E9C;">PAPER BALANCE</div>
        <div class="cap">₹<span id="ui-cap">5000.00</span></div>
    </div>
    <div style="text-align:right;">
        <div style="font-size:11px; color:#848E9C;">TODAY P&L (Limit -₹200)</div>
        <div class="pnl up" id="ui-pnl">₹0.00</div>
    </div>
</div>

<div class="tabs">
    <div class="tab active" id="tab-mkt" onclick="showTab('mkt')">MARKET & F&O</div>
    <div class="tab" id="tab-pos" onclick="showTab('pos')">POSITIONS (<span id="pos-cnt">0</span>)</div>
    <div class="tab" id="tab-his" onclick="showTab('his')">HISTORY</div>
</div>

<!-- SCREEN 1: MARKET & OPTIONS -->
<div class="box" id="scr-mkt">
    <div style="font-size:12px; color:#848E9C; margin-bottom:8px;">TAP ANY SHARE OR OPTION TO TRADE</div>
    <div id="market-list"></div>
</div>

<!-- SCREEN 2: ACTIVE POSITIONS -->
<div class="box" id="scr-pos" style="display:none;">
    <div id="pos-list"></div>
</div>

<!-- SCREEN 3: HISTORY & RESET -->
<div class="box" id="scr-his" style="display:none;">
    <button class="btn-gray" style="width:100%; margin-bottom:12px;" onclick="resetAll()">RESET ACCOUNT TO ₹5,000</button>
    <div id="his-list"></div>
</div>

<!-- ORDER POPUP -->
<div class="modal" id="ord-modal">
    <div class="modal-inner">
        <div class="row" style="margin-bottom:10px;">
            <strong id="m-name" style="font-size:18px;">STOCK</strong>
            <span id="m-ltp" class="up" style="font-size:16px;">₹0</span>
        </div>
        
        <label style="font-size:12px; color:#848E9C;">Quantity (शेयर या लॉट की संख्या):</label>
        <input type="number" id="m-qty" value="1">

        <label style="font-size:12px; color:#0ECB81;">Profit Target Price (₹):</label>
        <input type="number" id="m-tgt" step="0.1">

        <label style="font-size:12px; color:#F6465D;">Stop Loss Price (₹):</label>
        <input type="number" id="m-sl" step="0.1">

        <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="btn-buy" style="flex:1;" onclick="placeOrder('BUY')">BUY NOW</button>
            <button class="btn-sell" style="flex:1;" onclick="placeOrder('SELL')">SELL NOW</button>
        </div>
        <button class="btn-algo" style="width:100%; margin-top:8px;" onclick="toggleBot()">🤖 ON/OFF AUTO ALGO BOT</button>
        <button class="btn-gray" style="width:100%; margin-top:8px;" onclick="closeOrder()">CANCEL</button>
    </div>
</div>

<script>
// 1. DATA STORAGE
let state = JSON.parse(localStorage.getItem('khan_real_v1')) || {
    cap: 5000,
    pnl: 0,
    pos: [],
    his: [],
    bots: {}
};

let items = [
    { id: 'NIFTY_CE', name: 'NIFTY 25100 CE', price: 112.20 },
    { id: 'NIFTY_PE', name: 'NIFTY 25100 PE', price: 98.50 },
    { id: 'HORIZON', name: 'HORIZONIND (NSE)', price: 47.20 },
    { id: 'RELIANCE', name: 'RELIANCE (NSE)', price: 2985.50 },
    { id: 'SUZLON', name: 'SUZLON (NSE)', price: 46.50 },
    { id: 'ZOMATO', name: 'ZOMATO (NSE)', price: 185.30 },
    { id: 'YESBANK', name: 'YESBANK (NSE)', price: 24.80 }
];

let activeItem = null;

function saveData() {
    localStorage.setItem('khan_real_v1', JSON.stringify(state));
    document.getElementById('ui-cap').innerText = state.cap.toFixed(2);
    let pEl = document.getElementById('ui-pnl');
    pEl.innerText = (state.pnl >= 0 ? '+₹' : '-₹') + Math.abs(state.pnl).toFixed(2);
    pEl.className = 'pnl ' + (state.pnl >= 0 ? 'up' : 'down');
    document.getElementById('pos-cnt').innerText = state.pos.length;
}

// 2. TAB SWITCHING
function showTab(t) {
    document.getElementById('scr-mkt').style.display = t === 'mkt' ? 'block' : 'none';
    document.getElementById('scr-pos').style.display = t === 'pos' ? 'block' : 'none';
    document.getElementById('scr-his').style.display = t === 'his' ? 'block' : 'none';
    
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + t).classList.add('active');
    
    if(t === 'pos') drawPositions();
    if(t === 'his') drawHistory();
}

// 3. DRAW MARKET LIST ONCE (SO TOUCH NEVER BREAKS)
function buildMarket() {
    let html = '';
    items.forEach(item => {
        let botOn = state.bots[item.id] ? ' [BOT ON]' : '';
        html += `
        <div class="card row" onclick="openOrder('${item.id}')">
            <div>
                <div style="font-weight:bold; font-size:15px;">${item.name} <span style="color:#3861FB; font-size:11px;">${botOn}</span></div>
                <div style="font-size:11px; color:#848E9C;">Tap to Buy / Sell / Algo</div>
            </div>
            <div style="text-align:right;">
                <div class="up" style="font-size:16px;" id="p-${item.id}">₹${item.price.toFixed(2)}</div>
            </div>
        </div>`;
    });
    document.getElementById('market-list').innerHTML = html;
}

// 4. ORDER POPUP FUNCTIONS
function openOrder(id) {
    activeItem = items.find(x => x.id === id);
    document.getElementById('m-name').innerText = activeItem.name;
    document.getElementById('m-ltp').innerText = '₹' + activeItem.price.toFixed(2);
    document.getElementById('m-qty').value = activeItem.id.includes('NIFTY') ? 25 : 1;
    document.getElementById('m-tgt').value = (activeItem.price * 1.05).toFixed(2);
    document.getElementById('m-sl').value = (activeItem.price * 0.96).toFixed(2);
    document.getElementById('ord-modal').style.display = 'flex';
}

function closeOrder() {
    document.getElementById('ord-modal').style.display = 'none';
}

function placeOrder(side) {
    if (state.pnl <= -200) {
        alert('Daily Loss Limit ₹200 पूरा हो गया है! आज और ट्रेड नहीं हो सकते।');
        closeOrder();
        return;
    }
    let qty = parseInt(document.getElementById('m-qty').value) || 1;
    let tgt = parseFloat(document.getElementById('m-tgt').value);
    let sl = parseFloat(document.getElementById('m-sl').value);
    let cost = activeItem.price * qty;

    if (cost > state.cap) {
        alert('पर्याप्त बैलेंस नहीं है! Cost: ₹' + cost.toFixed(2));
        return;
    }

    state.cap -= cost;
    state.pos.push({
        id: activeItem.id,
        name: activeItem.name,
        side: side,
        qty: qty,
        buyPrice: activeItem.price,
        ltp: activeItem.price,
        high: activeItem.price,
        tgt: tgt,
        sl: sl
    });

    saveData();
    closeOrder();
    showTab('pos');
}

function toggleBot() {
    state.bots[activeItem.id] = !state.bots[activeItem.id];
    alert(activeItem.name + ' के लिए Auto Algo Bot ' + (state.bots[activeItem.id] ? 'चालू (ON)' : 'बंद (OFF)') + ' हो गया है!');
    saveData();
    buildMarket();
    closeOrder();
}

// 5. POSITIONS & EXIT ENGINE
function drawPositions() {
    let box = document.getElementById('pos-list');
    if (state.pos.length === 0) {
        box.innerHTML = '<div class="card" style="text-align:center; color:#848E9C; padding:30px;">कोई भी ओपन ट्रेड नहीं है। Market टैब से Buy/Sell करें।</div>';
        return;
    }
    let html = '';
    state.pos.forEach((p, idx) => {
        let diff = p.side === 'BUY' ? (p.ltp - p.buyPrice) : (p.buyPrice - p.ltp);
        let livePnl = diff * p.qty;
        html += `
        <div class="card">
            <div class="row">
                <strong>${p.name} (${p.side} x ${p.qty})</strong>
                <span class="${livePnl >= 0 ? 'up' : 'down'}" style="font-size:16px;" id="live-pnl-${idx}">
                    ${livePnl >= 0 ? '+₹' : '-₹'}${Math.abs(livePnl).toFixed(2)}
                </span>
            </div>
            <div style="font-size:12px; color:#848E9C; margin:6px 0;">
                Entry: ₹${p.buyPrice.toFixed(2)} | Live: <span id="live-ltp-${idx}">₹${p.ltp.toFixed(2)}</span>
            </div>
            <div style="font-size:11px; color:#F0B90B; margin-bottom:10px;">
                🎯 Target: ₹${p.tgt} | 🛡️ Trailing SL: ₹${p.sl}
            </div>
            <button class="btn-sell" style="width:100%;" onclick="exitTrade(${idx}, 'Manual Exit')">EXIT TRADE NOW</button>
        </div>`;
    });
    box.innerHTML = html;
}

function exitTrade(idx, reason) {
    let p = state.pos[idx];
    let diff = p.side === 'BUY' ? (p.ltp - p.buyPrice) : (p.buyPrice - p.ltp);
    let finalPnl = diff * p.qty;
    
    state.cap += (p.buyPrice * p.qty) + finalPnl;
    state.pnl += finalPnl;
    
    state.his.unshift({
        name: p.name,
        side: p.side,
        qty: p.qty,
        inP: p.buyPrice.toFixed(2),
        outP: p.ltp.toFixed(2),
        pnl: finalPnl.toFixed(2),
        reason: reason,
        time: new Date().toLocaleTimeString()
    });

    state.pos.splice(idx, 1);
    saveData();
    drawPositions();
}

function drawHistory() {
    let box = document.getElementById('his-list');
    if (state.his.length === 0) {
        box.innerHTML = '<div class="card" style="text-align:center; color:#848E9C;">अभी तक कोई ट्रेड बंद नहीं हुआ है।</div>';
        return;
    }
    let html = '';
    state.his.forEach(h => {
        let isProfit = parseFloat(h.pnl) >= 0;
        html += `
        <div class="card row">
            <div>
                <div style="font-weight:bold;">${h.name} (${h.side} x ${h.qty})</div>
                <div style="font-size:11px; color:#848E9C;">₹${h.inP} ➔ ₹${h.outP} | ${h.reason}</div>
                <div style="font-size:10px; color:#848E9C;">${h.time}</div>
            </div>
            <div class="${isProfit ? 'up' : 'down'}" style="font-size:15px;">
                ${isProfit ? '+₹' : '-₹'}${Math.abs(parseFloat(h.pnl)).toFixed(2)}
            </div>
        </div>`;
    });
    box.innerHTML = html;
}

function resetAll() {
    if(confirm('क्या आप बैलेंस वापस ₹5,000 करना चाहते हैं?')) {
        state = { cap: 5000, pnl: 0, pos: [], his: [], bots: {} };
        saveData();
        buildMarket();
        showTab('mkt');
    }
}

// 6. LIVE PRICE TICKER & 4 EXIT RULES LOOP
setInterval(() => {
    // Move Market Prices
    items.forEach(item => {
        let change = (Math.random() - 0.49) * (item.price * 0.005);
        item.price = Math.max(1, +(item.price + change).toFixed(2));
        let el = document.getElementById('p-' + item.id);
        if (el) el.innerText = '₹' + item.price.toFixed(2);

        // Auto Algo Bot Entry
        if (state.bots[item.id] && !state.pos.some(x => x.id === item.id) && state.pnl > -200) {
            let qty = item.id.includes('NIFTY') ? 25 : 1;
            let cost = item.price * qty;
            if (Math.random() < 0.2 && state.cap >= cost) {
                state.cap -= cost;
                state.pos.push({
                    id: item.id, name: item.name, side: 'BUY', qty: qty,
                    buyPrice: item.price, ltp: item.price, high: item.price,
                    tgt: +(item.price * 1.04).toFixed(2),
                    sl: +(item.price * 0.97).toFixed(2)
                });
                saveData();
                if (document.getElementById('scr-pos').style.display === 'block') drawPositions();
            }
        }
    });

    // Check Open Positions & 4 Exit Rules
    for (let i = state.pos.length - 1; i >= 0; i--) {
        let p = state.pos[i];
        let mItem = items.find(x => x.id === p.id);
        p.ltp = mItem.price;
        if (p.ltp > p.high) p.high = p.ltp;

        let diff = p.side === 'BUY' ? (p.ltp - p.buyPrice) : (p.buyPrice - p.ltp);
        let livePnl = diff * p.qty;

        // Update screen text smoothly
        let pnlEl = document.getElementById('live-pnl-' + i);
        let ltpEl = document.getElementById('live-ltp-' + i);
        if (pnlEl) {
            pnlEl.innerText = (livePnl >= 0 ? '+₹' : '-₹') + Math.abs(livePnl).toFixed(2);
            pnlEl.className = livePnl >= 0 ? 'up' : 'down';
        }
        if (ltpEl) ltpEl.innerText = '₹' + p.ltp.toFixed(2);

        // Rule 3: Trailing Stop Loss
        if (p.side === 'BUY' && p.ltp > p.buyPrice * 1.015) {
            let newSl = +(p.ltp * 0.99).toFixed(2);
            if (newSl > p.sl) p.sl = newSl;
        }

        // Rule 2: Early Weakness Exit
        let maxPnl = (p.high - p.buyPrice) * p.qty;
        if (p.side === 'BUY' && maxPnl > 30 && livePnl < maxPnl * 0.4) {
            exitTrade(i, 'Early Weakness Exit ⚡');
            continue;
        }

        // Rule 1 & 4: Target & Stop Loss
        if (p.side === 'BUY') {
            if (p.ltp >= p.tgt) exitTrade(i, 'Profit Target Hit 🎯');
            else if (p.ltp <= p.sl) exitTrade(i, 'Protective SL Hit 🛑');
        } else {
            if (p.ltp <= p.tgt) exitTrade(i, 'Profit Target Hit 🎯');
            else if (p.ltp >= p.sl) exitTrade(i, 'Protective SL Hit 🛑');
        }
    }

    // Daily Loss Limit Check
    if (state.pnl <= -200 && state.pos.length > 0) {
        for (let i = state.pos.length - 1; i >= 0; i--) {
            exitTrade(i, 'Daily Loss Limit (-₹200) 🛑');
        }
    }

}, 1500);

// START APP
saveData();
buildMarket();
</script>
</body>
  </html>
