<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHAN AI TRADER - Angel Pro Terminal</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; background-color: #0B0E14; color: #EAECEF; }
        .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; height: 100vh; background: #12161F; }
        
        /* Login Screen */
        .login-screen { position: fixed; inset: 0; background: #12161F; z-index: 100; display: flex; flex-direction: column; justify-content: center; padding: 24px; }
        .login-box { background: #181D27; padding: 20px; border-radius: 12px; border: 1px solid #262D3D; }
        .login-title { font-size: 20px; font-weight: 800; color: #3861FB; margin-bottom: 6px; text-align: center; }
        .login-sub { font-size: 12px; color: #848E9C; text-align: center; margin-bottom: 20px; }

        /* Login Toggle Tabs */
        .login-tabs { display: flex; margin-bottom: 16px; background: #12161F; border-radius: 6px; padding: 3px; }
        .login-tab { flex: 1; text-align: center; padding: 8px; font-size: 12px; font-weight: 700; color: #848E9C; cursor: pointer; border-radius: 4px; }
        .login-tab.active { background: #3861FB; color: #FFF; }

        /* Top Ticker Bar */
        .top-bar { background: #181D27; padding: 10px 14px; border-bottom: 1px solid #262D3D; display: flex; justify-content: space-between; align-items: center; }
        .index-box { display: flex; gap: 12px; font-size: 12px; }
        .idx-item div:first-child { color: #848E9C; font-weight: 600; font-size: 10px; }
        .idx-item div:last-child { font-weight: 700; margin-top: 2px; }
        .up { color: #0ECB81; }
        .down { color: #F6465D; }
        .mode-badge { background: #0ECB8122; color: #0ECB81; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; border: 1px solid #0ECB81; }

        /* Main Content */
        .main { flex: 1; overflow-y: auto; padding-bottom: 75px; }
        
        /* Search Bar */
        .search-bar { padding: 10px 14px; background: #181D27; border-bottom: 1px solid #262D3D; }
        .search-input { width: 100%; background: #12161F; border: 1px solid #2B3139; color: #FFF; padding: 10px 14px; border-radius: 6px; font-size: 13px; }

        /* Watchlist Item */
        .list-item { padding: 12px 14px; border-bottom: 1px solid #1E232F; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .list-item:active { background: #1C2230; }
        .sym-title { font-size: 14px; font-weight: 700; }
        .sym-sub { font-size: 11px; color: #848E9C; margin-top: 2px; }
        .price-col { text-align: right; }
        .ltp { font-size: 14px; font-weight: 700; }
        .chg { font-size: 11px; margin-top: 2px; }

        /* Buttons */
        .btn { border: none; padding: 10px 16px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; color: #FFF; }
        .btn-blue { background: #3861FB; }
        .btn-green { background: #0ECB81; color: #000; }
        .btn-red { background: #F6465D; }
        .btn-gray { background: #2B3139; color: #EAECEF; }

        /* Drawer */
        .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; justify-content: flex-end; flex-direction: column; }
        .drawer { background: #181D27; border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 18px; max-width: 480px; width: 100%; margin: 0 auto; border-top: 1px solid #2B3139; }
        .drawer-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #262D3D; padding-bottom: 12px; margin-bottom: 14px; }
        .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .input-box { background: #12161F; border: 1px solid #2B3139; color: #FFF; padding: 8px 12px; border-radius: 6px; width: 120px; text-align: right; font-size: 15px; font-weight: 700; }

        /* Form */
        .form-group { margin: 12px 0; }
        .form-group label { display: block; font-size: 12px; color: #848E9C; margin-bottom: 6px; }
        .form-input { width: 100%; background: #12161F; border: 1px solid #2B3139; color: #FFF; padding: 12px; border-radius: 6px; font-size: 14px; }

        /* Bottom Nav */
        .nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: #181D27; border-top: 1px solid #262D3D; display: flex; }
        .nav-btn { flex: 1; padding: 10px 0; text-align: center; color: #848E9C; font-size: 11px; font-weight: 600; cursor: pointer; }
        .nav-btn.active { color: #3861FB; }
        .nav-icon { font-size: 18px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <div class="login-title">KHAN AI TERMINAL</div>
        <div class="login-sub">Choose your login method</div>
        
        <div class="login-tabs">
            <div class="login-tab active" id="tabClient" onclick="switchLoginMode('client')">Client ID / MPIN</div>
            <div class="login-tab" id="tabMobile" onclick="switchLoginMode('mobile')">Mobile Number / OTP</div>
        </div>

        <!-- Client Form -->
        <div id="formClient">
            <div class="form-group">
                <label>Client Code</label>
                <input type="text" id="loginClient" class="form-input" value="K892341" placeholder="Enter Client ID">
            </div>
            <div class="form-group">
                <label>MPIN / Password</label>
                <input type="password" id="loginMpin" class="form-input" value="1234" placeholder="Enter MPIN">
            </div>
        </div>

        <!-- Mobile OTP Form -->
        <div id="formMobile" style="display:none;">
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="loginPhone" class="form-input" placeholder="Enter 10-digit mobile number" maxlength="10">
            </div>
            <div class="form-group" id="otpGroup" style="display:none;">
                <label>Enter 4-Digit OTP</label>
                <input type="password" id="loginOtp" class="form-input" value="1234" placeholder="Enter OTP (e.g. 1234)">
            </div>
            <button class="btn btn-gray" id="otpBtn" style="width:100%; margin-bottom:10px;" onclick="sendOtp()">SEND OTP</button>
        </div>

        <button class="btn btn-blue" style="width:100%; padding:14px; margin-top:6px;" onclick="handleLogin()">LOGIN TO TERMINAL</button>
    </div>
</div>

<div class="app">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="index-box">
            <div class="idx-item">
                <div>NIFTY 50</div>
                <div id="topNifty" class="up">22,450.00</div>
            </div>
            <div class="idx-item">
                <div>SENSEX</div>
                <div id="topSensex" class="up">73,850.00</div>
            </div>
        </div>
        <div class="mode-badge">LIVE PAPER</div>
    </div>

    <!-- Main Screen -->
    <div class="main" id="screen"></div>

    <!-- Bottom Nav -->
    <div class="nav">
        <div class="nav-btn active" id="nav-watchlist" onclick="setTab('watchlist')"><span class="nav-icon">📋</span>Watchlist</div>
        <div class="nav-btn" id="nav-algo" onclick="setTab('algo')"><span class="nav-icon">🤖</span>AI Algos</div>
        <div class="nav-btn" id="nav-positions" onclick="setTab('positions')"><span class="nav-icon">💼</span>Positions</div>
        <div class="nav-btn" id="nav-account" onclick="setTab('account')"><span class="nav-icon">👤</span>Profile</div>
    </div>
</div>

<!-- Order Drawer -->
<div class="drawer-overlay" id="orderDrawer">
    <div class="drawer">
        <div class="drawer-head">
            <div>
                <div id="ordSymbol" style="font-size:16px; font-weight:700;">RELIANCE</div>
                <div id="ordLtp" style="font-size:13px; color:#0ECB81; margin-top:2px;">LTP: ₹ 2,985.50</div>
            </div>
            <button class="btn btn-gray" style="padding:6px 10px;" onclick="closeOrder()">✕</button>
        </div>

        <div class="input-row">
            <span style="font-size:13px; color:#848E9C;">Quantity</span>
            <input type="number" id="ordQty" class="input-box" value="1" min="1" onchange="calcCost()">
        </div>

        <div class="input-row">
            <span style="font-size:13px; color:#848E9C;">Min Investment</span>
            <span style="font-size:13px; color:#F0B90B;">₹ 1,000+ Allowed</span>
        </div>

        <div style="display:flex; justify-content:space-between; background:#12161F; padding:10px; border-radius:6px; font-size:12px; margin-bottom:14px;">
            <span style="color:#848E9C;">Total Cost: <strong id="ordTotal" style="color:#FFF;">₹ 0</strong></span>
            <span style="color:#848E9C;">Available: <strong id="ordAvail" style="color:#0ECB81;">₹ 50,000</strong></span>
        </div>

        <div style="display:flex; gap:10px;">
            <button class="btn btn-green" style="flex:1; padding:14px;" onclick="placeOrder('BUY')">BUY</button>
            <button class="btn btn-red" style="flex:1; padding:14px;" onclick="placeOrder('SELL')">SELL</button>
        </div>
    </div>
</div>

<script>
    let activeTab = 'watchlist';
    let balance = 50000;
    let niftyPrice = 22450.00;
    let sensexPrice = 73850.00;
    let positions = [];
    let customAlgos = [];
    let searchQuery = '';
    let selectedStock = null;
    let loginMode = 'client';

    let masterStocks = [
        { sym: 'RELIANCE', exch: 'NSE EQ', price: 2985.50, base: 2960 },
        { sym: 'TCS', exch: 'NSE EQ', price: 3920.00, base: 3900 },
        { sym: 'HDFCBANK', exch: 'NSE EQ', price: 1542.00, base: 1530 },
        { sym: 'INFY', exch: 'NSE EQ', price: 1650.50, base: 1640 },
        { sym: 'TATAMOTORS', exch: 'NSE EQ', price: 984.20, base: 990 },
        { sym: 'SBIN', exch: 'NSE EQ', price: 765.40, base: 758 },
        { sym: 'SUZLON', exch: 'BSE/NSE', price: 46.50, base: 45.00 },
        { sym: 'ZOMATO', exch: 'NSE EQ', price: 185.30, base: 180 },
        { sym: 'ITC', exch: 'NSE EQ', price: 432.10, base: 430 },
        { sym: 'ICICIBANK', exch: 'NSE EQ', price: 1090.00, base: 1080 },
        { sym: 'BHARTIARTL', exch: 'NSE EQ', price: 1240.00, base: 1230 },
        { sym: 'ADANIENT', exch: 'NSE EQ', price: 3150.00, base: 3100 },
        { sym: 'TATAPOWER', exch: 'NSE EQ', price: 410.50, base: 405 },
        { sym: 'IDEA', exch: 'BSE/NSE', price: 14.20, base: 14.00 }
    ];

    function switchLoginMode(mode) {
        loginMode = mode;
        document.getElementById('tabClient').classList.toggle('active', mode === 'client');
        document.getElementById('tabMobile').classList.toggle('active', mode === 'mobile');
        document.getElementById('formClient').style.display = mode === 'client' ? 'block' : 'none';
        document.getElementById('formMobile').style.display = mode === 'mobile' ? 'block' : 'none';
    }

    function sendOtp() {
        const phone = document.getElementById('loginPhone').value;
        if (phone.length < 10) {
            alert('Kripya sahi 10-digit mobile number daalein.');
            return;
        }
        document.getElementById('otpGroup').style.display = 'block';
        document.getElementById('otpBtn').innerText = 'OTP SENT (DEMO: 1234)';
        alert('Demo OTP sent to ' + phone + ' (Use 1234 to login)');
    }

    function handleLogin() {
        if (loginMode === 'client') {
            const client = document.getElementById('loginClient').value;
            if (!client) {
                alert('Kripya Client ID daalein.');
                return;
            }
        } else {
            const phone = document.getElementById('loginPhone').value;
            const otp = document.getElementById('loginOtp').value;
            if (!phone || otp !== '1234') {
                alert('Kripya sahi mobile number aur valid OTP (1234) daalein.');
                return;
            }
        }
        document.getElementById('loginScreen').style.display = 'none';
        render();
    }

    // Live Tick Loop
    setInterval(() => {
        niftyPrice = +(niftyPrice + (Math.random() - 0.48) * 12).toFixed(2);
        sensexPrice = +(sensexPrice + (Math.random() - 0.48) * 35).toFixed(2);

        document.getElementById('topNifty').innerText = niftyPrice.toLocaleString('en-IN');
        document.getElementById('topSensex').innerText = sensexPrice.toLocaleString('en-IN');

        masterStocks.forEach(s => {
            s.price = +(s.price * (1 + (Math.random() - 0.49) * 0.004)).toFixed(2);
        });

        positions.forEach(p => {
            const liveObj = masterStocks.find(x => x.sym === p.sym);
            if (liveObj) p.ltp = liveObj.price;
        });

        customAlgos.forEach(a => {
            if (a.active && Math.random() < 0.12) {
                const st = masterStocks.find(x => x.sym === a.sym);
                if (st && balance >= 1000) {
                    const qty = Math.max(1, Math.floor(1000 / st.price));
                    const cost = st.price * qty;
                    balance -= cost;
                    positions.push({
                        sym: st.sym,
                        side: 'BUY',
                        qty: qty,
                        avg: st.price,
                        ltp: st.price,
                        source: 'AI Algo (' + a.sym + ')'
                    });
                }
            }
        });

        render();
    }, 1500);

    function setTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('nav-' + tab).classList.add('active');
        render();
    }

    function openOrder(sym, price) {
        selectedStock = { sym, price };
        document.getElementById('ordSymbol').innerText = sym;
        document.getElementById('ordLtp').innerText = 'LTP: ₹ ' + price.toFixed(2);
        let defQty = Math.max(1, Math.floor(1000 / price));
        document.getElementById('ordQty').value = defQty;
        document.getElementById('ordAvail').innerText = '₹ ' + balance.toLocaleString('en-IN');
        calcCost();
        document.getElementById('orderDrawer').style.display = 'flex';
    }

    function closeOrder() {
        document.getElementById('orderDrawer').style.display = 'none';
    }

    function calcCost() {
        if (!selectedStock) return;
        const qty = parseInt(document.getElementById('ordQty').value) || 1;
        const total = +(selectedStock.price * qty).toFixed(2);
        document.getElementById('ordTotal').innerText = '₹ ' + total.toLocaleString('en-IN');
    }

    function placeOrder(side) {
        const qty = parseInt(document.getElementById('ordQty').value) || 1;
        const cost = +(selectedStock.price * qty).toFixed(2);

        if (cost < 1000) {
            alert('Minimum trade amount ₹1,000 se kam nahi ho sakta!');
            return;
        }
        if (cost > balance) {
            alert('Insufficient Funds! Available Balance: ₹' + balance);
            return;
        }

        balance = +(balance - cost).toFixed(2);
        positions.push({
            sym: selectedStock.sym,
            side: side,
            qty: qty,
            avg: selectedStock.price,
            ltp: selectedStock.price,
            source: 'Manual'
        });

        closeOrder();
        setTab('positions');
    }

    function exitPosition(index) {
        const p = positions[index];
        const pnl = p.side === 'BUY' ? (p.ltp - p.avg) * p.qty : (p.avg - p.ltp) * p.qty;
        const release = (p.avg * p.qty) + pnl;
        balance = +(balance + release).toFixed(2);
        positions.splice(index, 1);
        render();
    }

    function addSingleStockAlgo(sym) {
        if (customAlgos.some(a => a.sym === sym)) {
            alert('Is share par algo pehle se added hai!');
            return;
        }
        customAlgos.push({ sym: sym, active: true });
        alert(`AI Algorithm successfully activated for: ${sym}`);
        setTab('algo');
    }

    function toggleCustomAlgo(sym) {
        const a = customAlgos.find(x => x.sym === sym);
        if (a) a.active = !a.active;
        render();
    }

    function render() {
        const screen = document.getElementById('screen');

        if (activeTab === 'watchlist') {
            const filtered = masterStocks.filter(s => s.sym.toLowerCase().includes(searchQuery.toLowerCase()));
            let html = `
                <div class="search-bar">
                    <input type="text" class="search-input" placeholder="Search BSE / NSE shares..." value="${searchQuery}" oninput="searchQuery=this.value; render();">
                </div>
            `;
            filtered.forEach(w => {
                const diff = +(w.price - w.base).toFixed(2);
                const pct = +((diff / w.base) * 100).toFixed(2);
                const isUp = diff >= 0;
                html += `
                    <div class="list-item">
                        <div onclick="openOrder('${w.sym}', ${w.price})" style="flex:1;">
                            <div class="sym-title">${w.sym}</div>
                            <div class="sym-sub">${w.exch} • Tap to Trade</div>
                        </div>
                        <div class="price-col" onclick="openOrder('${w.sym}', ${w.price})" style="margin-right:12px;">
                            <div class="ltp ${isUp ? 'up' : 'down'}">₹ ${w.price.toLocaleString('en-IN')}</div>
                            <div class="chg ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${diff} (${pct}%)</div>
                        </div>
                        <button class="btn btn-blue" style="padding:6px 10px; font-size:11px;" onclick="addSingleStockAlgo('${w.sym}')">+ AI Algo</button>
                    </div>
                `;
            });
            screen.innerHTML = html;

        } else if (activeTab === 'algo') {
            let html = `<div style="padding:14px; font-size:14px; font-weight:700;">SINGLE SHARE AI ALGORITHMS (Min ₹1,000)</div>`;
            if (customAlgos.length === 0) {
                html += `<div style="text-align:center; color:#848E9C; margin-top:40px; font-size:13px; padding:0 20px;">Koi single share algo active nahi hai.<br><b>Watchlist</b> mein jakar kisi bhi share ke samne <b>+ AI Algo</b> dabayein!</div>`;
            } else {
                customAlgos.forEach(a => {
                    html += `
                        <div style="background:#181D27; margin:12px; padding:14px; border-radius:8px; border:1px solid #262D3D; display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <div style="font-size:16px; font-weight:700;">${a.sym} AI Bot</div>
                                <div style="font-size:12px; color:#0ECB81; margin-top:4px;">Status: ${a.active ? 'RUNNING' : 'PAUSED'}</div>
                            </div>
                            <button class="btn ${a.active ? 'btn-red' : 'btn-green'}" onclick="toggleCustomAlgo('${a.sym}')">
                                ${a.active ? 'STOP' : 'START'}
                            </button>
                        </div>
                    `;
                });
            }
            screen.innerHTML = html;

        } else if (activeTab === 'positions') {
            let totalPnL = 0;
            positions.forEach(p => {
                totalPnL += p.side === 'BUY' ? (p.ltp - p.avg)
