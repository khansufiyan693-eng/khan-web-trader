<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHAN PRO TRADER - Live Terminal & Algo</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; background-color: #0B0E14; color: #EAECEF; }
        .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; height: 100vh; background: #12161F; position: relative; }
        
        /* Top Bar */
        .top-bar { background: #181D27; padding: 10px 14px; border-bottom: 1px solid #262D3D; display: flex; justify-content: space-between; align-items: center; }
        .idx-box { font-size: 11px; }
        .up { color: #0ECB81; font-weight: 700; }
        .down { color: #F6465D; font-weight: 700; }

        /* Navigation Tabs */
        .nav-tabs { display: flex; background: #181D27; border-bottom: 1px solid #262D3D; overflow-x: auto; }
        .n-tab { padding: 10px 14px; font-size: 12px; font-weight: 700; color: #848E9C; cursor: pointer; white-space: nowrap; }
        .n-tab.active { color: #3861FB; border-bottom: 2px solid #3861FB; }

        /* Main Content */
        .main { flex: 1; overflow-y: auto; padding-bottom: 70px; }

        /* Search & Lists */
        .search-box { padding: 10px 14px; background: #181D27; border-bottom: 1px solid #262D3D; }
        .inp { width: 100%; background: #12161F; border: 1px solid #2B3139; color: #FFF; padding: 10px; border-radius: 6px; font-size: 13px; outline: none; }
        .stock-item { padding: 12px 14px; border-bottom: 1px solid #1E232F; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .stock-item:active { background: #1A202C; }

        /* Buttons */
        .btn { border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; color: #FFF; }
        .btn-blue { background: #3861FB; }
        .btn-green { background: #0ECB81; color: #000; }
        .btn-red { background: #F6465D; }
        .btn-gray { background: #2B3139; color: #EAECEF; }

        /* Bottom Nav Bar */
        .b-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: #181D27; border-top: 1px solid #262D3D; display: flex; z-index: 50; }
        .b-btn { flex: 1; padding: 10px 0; text-align: center; color: #848E9C; font-size: 10px; font-weight: 700; cursor: pointer; }
        .b-btn.active { color: #3861FB; }

        /* Modal Drawer */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: flex-end; flex-direction: column; }
        .modal-card { background: #181D27; padding: 20px; border-top-left-radius: 16px; border-top-right-radius: 16px; max-width: 480px; width: 100%; margin: 0 auto; border-top: 1px solid #2B3139; }
    </style>
</head>
<body>

<div class="app">
    <!-- Top Indices -->
    <div class="top-bar">
        <div class="idx-box">NIFTY: <span id="niftyVal" class="up">25,144.30</span></div>
        <div class="idx-box">SENSEX: <span id="sensexVal" class="up">81,592.45</span></div>
        <div style="background:#0ECB8122; color:#0ECB81; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:700;">LIVE PRO</div>
    </div>

    <!-- Sub Navigation Tabs -->
    <div class="nav-tabs">
        <div class="n-tab active" id="tab-watch" onclick="switchTab('watch')">Watchlist</div>
        <div class="n-tab" id="tab-options" onclick="switchTab('options')">Option Chain</div>
        <div class="n-tab" id="tab-chart" onclick="switchTab('chart')">TradingView Chart</div>
        <div class="n-tab" id="tab-algo" onclick="switchTab('algo')">Pro Algo Engine</div>
        <div class="n-tab" id="tab-pos" onclick="switchTab('pos')">Positions & P&L</div>
    </div>

    <!-- Main Dynamic Container -->
    <div class="main" id="mainContainer"></div>

    <!-- Bottom Menu -->
    <div class="b-nav">
        <div class="b-btn active" id="b-home" onclick="switchTab('watch')">📋 Watch</div>
        <div class="b-btn" id="b-opt" onclick="switchTab('options')">⛓️ F&O</div>
        <div class="b-btn" id="b-alg" onclick="switchTab('algo')">🤖 AI Algo</div>
        <div class="b-btn" id="b-pnl" onclick="switchTab('pos')">💼 Portfolio</div>
        <div class="b-btn" id="b-acc" onclick="switchTab('acc')">👤 Account</div>
    </div>
</div>

<!-- Order Modal -->
<div class="modal-overlay" id="orderModal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
            <strong id="mSym" style="font-size:16px;">RELIANCE</strong>
            <span onclick="closeModal()" style="cursor:pointer; color:#848E9C; font-size:16px;">✕</span>
        </div>
        <div style="font-size:13px; color:#0ECB81; margin-bottom:14px;" id="mPrice">LTP: ₹0</div>
        
        <div style="margin-bottom:12px;">
            <label style="font-size:12px; color:#848E9C; display:block; margin-bottom:4px;">Quantity (Min ₹1,000 Investment)</label>
            <input type="number" id="mQty" class="inp" value="1" oninput="calcTotal()">
        </div>

        <div style="display:flex; justify-content:space-between; background:#12161F; padding:10px; border-radius:6px; font-size:12px; margin-bottom:16px;">
            <span style="color:#848E9C;">Total Cost: <strong id="mCost" style="color:#FFF;">₹0</strong></span>
            <span style="color:#848E9C;">Balance: <strong style="color:#0ECB81;">₹<span id="mBal">50,000</span></strong></span>
        </div>

        <div style="display:flex; gap:10px;">
            <button class="btn btn-green" style="flex:1; padding:14px;" onclick="placeTrade('BUY')">BUY</button>
            <button class="btn btn-red" style="flex:1; padding:14px;" onclick="placeTrade('SELL')">SELL</button>
        </div>
    </div>
</div>

<script>
    let currentTab = 'watch';
    let balance = 50000;
    let nifty = 25144.30;
    let sensex = 81592.45;
    let searchTxt = '';
    let selectedAsset = null;
    let positions = [];
    let algos = [
        { id: 1, name: 'Nifty 9:20 Breakout Algo', status: false, pnl: 0 },
        { id: 2, name: 'BankNifty RSI Scalper Bot', status: false, pnl: 0 },
        { id: 3, name: 'SuperTrend Stock Momentum', status: false, pnl: 0 }
    ];

    let masterStocks = [
        { sym: 'RELIANCE', exch: 'NSE', price: 2985.50, base: 2950 },
        { sym: 'TCS', exch: 'NSE', price: 3920.00, base: 3900 },
        { sym: 'HDFCBANK', exch: 'NSE', price: 1542.00, base: 1535 },
        { sym: 'INFY', exch: 'NSE', price: 1650.50, base: 1640 },
        { sym: 'TATAMOTORS', exch: 'NSE', price: 984.20, base: 975 },
        { sym: 'SBIN', exch: 'NSE', price: 765.40, base: 758 },
        { sym: 'SUZLON', exch: 'BSE/NSE', price: 46.50, base: 45.00 },
        { sym: 'ZOMATO', exch: 'NSE', price: 185.30, base: 180 },
        { sym: 'ITC', exch: 'NSE', price: 432.10, base: 430 },
        { sym: 'ICICIBANK', exch: 'NSE', price: 1090.00, base: 1080 },
        { sym: 'BHARTIARTL', exch: 'NSE', price: 1240.00, base: 1230 },
        { sym: 'ADANIENT', exch: 'NSE', price: 3150.00, base: 3100 },
        { sym: 'TATAPOWER', exch: 'NSE', price: 410.50, base: 405 },
        { sym: 'IDEA', exch: 'BSE/NSE', price: 14.20, base: 14.00 }
    ];

    // Live Tick Simulation
    setInterval(() => {
        nifty = +(nifty + (Math.random() - 0.48) * 12).toFixed(2);
        sensex = +(sensex + (Math.random() - 0.48) * 35).toFixed(2);
        document.getElementById('niftyVal').innerText = nifty.toLocaleString('en-IN');
        document.getElementById('sensexVal').innerText = sensex.toLocaleString('en-IN');

        masterStocks.forEach(s => {
            s.price = +(s.price * (1 + (Math.random() - 0.49) * 0.004)).toFixed(2);
        });

        positions.forEach(p => {
            let found = masterStocks.find(x => x.sym === p.sym);
            if (found) p.ltp = found.price;
        });

        // Run Active Algos
        algos.forEach(a => {
            if (a.status && Math.random() < 0.1) {
                let randomStock = masterStocks[Math.floor(Math.random() * masterStocks.length)];
                if (balance >= 1000) {
                    let qty = Math.max(1, Math.floor(1000 / randomStock.price));
                    balance -= randomStock.price * qty;
                    positions.push({
                        sym: randomStock.sym,
                        side: 'BUY',
                        qty: qty,
                        avg: randomStock.price,
                        ltp: randomStock.price,
                        tag: a.name
                    });
                }
            }
        });

        render();
    }, 1500);

    function switchTab(t) {
        currentTab = t;
        document.querySelectorAll('.n-tab').forEach(el => el.classList.remove('active'));
        let target = document.getElementById('tab-' + t);
        if (target) target.classList.add('active');
        render();
    }

    function openModal(sym, price) {
        selectedAsset = { sym, price };
        document.getElementById('mSym').innerText = sym;
        document.getElementById('mPrice').innerText = 'LTP: ₹ ' + price.toFixed(2);
        document.getElementById('mBal').innerText = balance.toLocaleString('en-IN');
        let minQ = Math.max(1, Math.ceil(1000 / price));
        document.getElementById('mQty').value = minQ;
        calcTotal();
        document.getElementById('orderModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('orderModal').style.display = 'none';
    }

    function calcTotal() {
        if (!selectedAsset) return;
        let q = parseInt(document.getElementById('mQty').value) || 1;
        let total = +(selectedAsset.price * q).toFixed(2);
        document.getElementById('mCost').innerText = '₹ ' + total.toLocaleString('en-IN');
    }

    function placeTrade(side) {
        let q = parseInt(document.getElementById('mQty').value) || 1;
        let cost = +(selectedAsset.price * q).toFixed(2);
        if (cost < 1000) {
            alert('Minimum trade amount ₹1,000 required!');
            return;
        }
        if (cost > balance) {
            alert('Insufficient balance!');
            return;
        }
        balance = +(balance - cost).toFixed(2);
        positions.push({
            sym: selectedAsset.sym,
            side: side,
            qty: q,
            avg: selectedAsset.price,
            ltp: selectedAsset.price,
            tag: 'Manual'
        });
        closeModal();
        switchTab('pos');
    }

    function exitPos(idx) {
        let p = positions[idx];
        let pnl = p.side === 'BUY' ? (p.ltp - p.avg) * p.qty : (p.avg - p.ltp) * p.qty;
        balance = +(balance + (p.avg * p.qty) + pnl).toFixed(2);
        positions.splice(idx, 1);
        render();
    }

    function toggleAlgo(id) {
        let al = algos.find(x => x.id === id);
        if (al) al.status = !al.status;
        render();
    }

    function render() {
        let box = document.getElementById('mainContainer');
        if (!box) return;

        if (currentTab === 'watch') {
            let filtered = masterStocks.filter(s => s.sym.toLowerCase().includes(searchTxt.toLowerCase()));
            let h = `
                <div class="search-box">
                    <input type="text" class="inp" placeholder="Search BSE / NSE shares (e.g. Reliance, Suzlon)..." value="${searchTxt}" oninput="searchTxt=this.value; render();">
                </div>
            `;
            filtered.forEach(s => {
                let diff = +(s.price - s.base).toFixed(2);
                let pct = +((diff / s.base) * 100).toFixed(2);
                let isUp = diff >= 0;
                h += `
                    <div class="stock-item" onclick="openModal('${s.sym}', ${s.price})">
                        <div>
                            <div style="font-weight:700; font-size:14px;">${s.sym}</div>
                            <div style="font-size:11px; color:#848E9C; margin-top:2px;">${s.exch} • Tap to Trade</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:700; font-size:14px;" class="${isUp ? 'up' : 'down'}">₹ ${s.price.toLocaleString('en-IN')}</div>
                            <div style="font-size:11px;" class="${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${diff} (${pct}%)</div>
                        </div>
                    </div>
                `;
            });
            box.innerHTML = h;

        } else if (currentTab === 'options') {
            let atm = Math.round(nifty / 50) * 50;
            let strikes = [atm-150, atm-100, atm-50, atm, atm+50, atm+100, atm+150];
            let h = `
                <div style="padding:12px 14px; background:#181D27; font-weight:700; font-size:13px; display:flex; justify-content:space-between; border-bottom:1px solid #262D3D;">
                    <span>NIFTY OPTION CHAIN</span>
                    <span style="color:#0ECB81;">Spot: ${nifty}</span>
                </div>
                <div style="display:grid; grid-template-columns:1fr 0.8fr 1fr; text-align:center; background:#151A24; padding:8px; font-size:11px; color:#848E9C; font-weight:700;">
                    <div>CALL (CE)</div>
                    <div>STRIKE</div>
                    <div>PUT (PE)</div>
                </div>
            `;
            strikes.forEach(st => {
                let ce = +(120 + Math.random() * 30).toFixed(2);
                let pe = +(110 + Math.random() * 30).toFixed(2);
                h += `
                    <div style="display:grid; grid-template-columns:1fr 0.8fr 1fr; text-align:center; border-bottom:1px solid #1E232F; font-size:13px; align-items:center;">
                        <div style="padding:12px; color:#0ECB81; cursor:pointer;" onclick="openModal('NIFTY ${st} CE', ${ce})">₹ ${ce}</div>
                        <div style="background:#181D27; padding:12px; font-weight:700; color:#F0B90B;">${st}</div>
                        <div style="padding:12px; color:#F6465D; cursor:pointer;" onclick="openModal('NIFTY ${st} PE', ${pe})">₹ ${pe}</div>
                    </div>
                `;
            });
            box.innerHTML = h;

        } else if (currentTab === 'chart') {
            box.innerHTML = `
                <div style="padding:16px;">
                    <div style="font-size:14px; font-weight:700; margin-bottom:8px;">TradingView Pro Live Chart (NIFTY 50)</div>
                    <div style="background:#181D27; padding:16px; border-radius:8px; border:1px solid #262D3D; text-align:center;">
                        <div style="font-size:22px; font-weight:800; color:#0ECB81; margin-bottom:8px;">₹ ${nifty.toLocaleString('en-IN')}</div>
                        <div style="font-size:12px; color:#848E9C; margin-bottom:16px;">Candlestick & Indicator engine active. Live tick feed connected.</div>
                        <button class="btn btn-blue" onclick="openModal('NIFTY 50', nifty)">TRADE NIFTY NOW</button>
                    </div>
                </div>
            `;

        } else if (currentTab === 'algo') {
            let h = `<div style="padding:14px; font-size:14px; font-weight:700;">AUTOMATED PRO AI ALGO BOTS (Min ₹1,000)</div>`;
            algos.forEach(a => {
                h += `
                    <div style="background:#181D27; margin:12px 14px; padding:14px; border-radius:8px; border:1px solid #262D3D; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-size:15px; font-weight:700;">${a.name}</div>
                            <div style="font-size:11px; color:${a.status ? '#0ECB81' : '#848E9C'}; margin-top:4px;">Status: ${a.status ? 'RUNNING (Auto Trade)' : 'PAUSED'}</div>
                        </div>
                        <button class="btn ${a.status ? 'btn-red' : 'btn-green'}" onclick="toggleAlgo(${a.id})">${a.status ? 'STOP' : 'START'}</button>
                    </div>
                `;
            });
            box.innerHTML = h;

        } else if (currentTab === 'pos') {
            let tot = 0;
            positions.forEach(p => {
                tot += p.side === 'BUY' ? (p.ltp - p.avg) * p.qty : (p.avg - p.ltp) * p.qty;
            });
            let h = `
                <div style="padding:16px; background:#181D27; border-bottom:1px solid #262D3D; text-align:center;">
                    <div style="font-size:12px; color:#848E9C;">TOTAL PORTFOLIO MTM P&L</div>
                    <div style="font-size:24px; font-weight:800; margin-top:4px;" class="${tot >= 0 ? 'up' : 'down'}">${tot >= 0 ? '+' : ''}₹ ${tot.toFixed(2)}</div>
                </div>
            `;
            if (positions.length === 0) {
                h += `<div style="text-align:center; color:#848E9C; margin-top:40px; font-size:13px;">No active positions or trades.</div>`;
            } else {
                positions.forEach((p, idx) => {
                    let pnl = p.side === 'BUY' ? (p.ltp - p.avg) * p.qty : (p.avg - p.ltp) * p.qty;
                    h += `
                        <div class="stock-item">
                            <div>
                                <div style="font-weight:700;">${p.sym} <span style="font-size:10px; background:#2B3139; padding:2px 6px; border-radius:4px;">${p.side}</span></div>
                                <div style="font-size:11px; color:#848E9C; margin-top:2px;">Qty: ${p.qty} | Avg: ₹${p.avg} | Source: ${p.tag}</div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-weight:700;" class="${pnl >= 0 ? 'up' : 'down'}">${pnl >= 0 ? '+' : ''}₹ ${pnl.toFixed(2)}</div>
                                <button class="btn btn-red" style="padding:4px 8px; font-size:10px; margin-top:4px;" onclick="exitPos(${idx})">EXIT</button>
                            </div>
                        </div>
                    `;
                });
            }
            box.innerHTML = h;

        } else if (currentTab === 'acc') {
            box.innerHTML = `
                <div style="margin:16px; background:#181D27; padding:18px; border-radius:8px; border:1px solid #262D3D;">
                    <div style="font-size:12px; color:#848E9C;">AVAILABLE PAPER TRADING CAPITAL</div>
                    <div style="font-size:26px; font-weight:800; color:#0ECB81; margin:6px 0;">₹ ${balance.toLocaleString('en-IN')}</div>
                    <button class="btn btn-gray" style="width:100%; margin-top:10px;" onclick="balance=50000; positions=[]; render();">Reset Capital to ₹50,000</button>
                </div>
            `;
        }
    }

    render();
</script>
</body>
</html>
