 let hist=state.history.slice(0,8).map(h=>`<tr><td>${esc(h.symbol)}</td><td>${money(h.entry)}</td><td>${money(h.exit)}</td><td class="${h.net>=0?'text-green-700':'text-red-700'}">${money(h.net)}</td><td>${esc(h.reason)}</td></tr>`).join('')||'<tr><td colspan="5">No closed paper trades yet.</td></tr>';
 root.innerHTML=`<div class="flex flex-wrap items-center justify-between gap-2"><div><h3 class="text-lg font-black">Mobile Paper Lab — V15</h3><p class="text-xs text-amber-800 font-bold">SIMULATED MARKET ONLY • NOT LIVE ANGEL ONE DATA</p></div><span class="rounded-full px-3 py-1 text-xs font-black ${state.running?'bg-green-100 text-green-800':'bg-zinc-100'}">${state.running?'RUNNING':'PAUSED'}</span></div>
 <div class="mt-3 grid grid-cols-2 gap-2"><div class="rounded-xl bg-white p-3 border"><small>Paper cash</small><b class="block text-lg">${money(state.cash)}</b></div><div class="rounded-xl bg-white p-3 border"><small>Unrealized P&L (before exit fees)</small><b class="block text-lg">${money(livePnl())}</b></div></div>
 <label class="mt-3 block text-xs font-bold">Paper starting capital (₹) — reset required to apply <input id="pl-capital" type="number" min="1000" step="1000" value="${state.capital}" class="mt-1 w-full rounded-lg border bg-white p-3 text-base"></label>
 <div class="mt-3 grid grid-cols-2 gap-2"><button id="pl-start" class="rounded-xl bg-green-700 p-3 font-bold text-white">Start simulator</button><button id="pl-pause" class="rounded-xl bg-zinc-800 p-3 font-bold text-white">Pause</button><button id="pl-auto" class="rounded-xl ${state.auto?'bg-blue-700':'bg-white'} border p-3 font-bold ${state.auto?'text-white':''}">Auto scanner: ${state.auto?'ON':'OFF'}</button><button id="pl-scan" class="rounded-xl border bg-white p-3 font-bold">Scan now</button></div>
 <div class="mt-3 rounded-xl border bg-white p-3"><b class="text-sm">Scanner status</b><p class="mt-1 text-xs">${esc(lastScan)}</p><p class="mt-1 text-[11px] text-zinc-500">Rule: estimated net target profit must be at least ₹250 after this simulator's illustrative charges. This is not a prediction or guarantee.</p></div>
 <h4 class="mt-4 font-black text-sm">Simulated watchlist / quotes</h4><div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead><tr><th>Instrument</th><th>Simulated price</th><th>Type</th></tr></thead><tbody>${rows}</tbody></table></div>
 <h4 class="mt-4 font-black text-sm">Open paper positions</h4><div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead><tr><th>Instrument</th><th>Qty</th><th>Entry</th><th>Sim LTP</th><th>Gross P&L</th><th></th></tr></thead><tbody>${pos}</tbody></table></div>
 <h4 class="mt-4 font-black text-sm">Recent closed trades</h4><div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead><tr><th>Instrument</th><th>Entry</th><th>Exit</th><th>Net P&L</th><th>Reason</th></tr></thead><tbody>${hist}</tbody></table></div>
 <div class="mt-3 grid grid-cols-2 gap-2"><button id="pl-reset" class="rounded-xl border border-red-300 bg-white p-3 text-xs font-bold text-red-700">Reset paper account</button><button id="pl-export" class="rounded-xl border bg-white p-3 text-xs font-bold">Export trade CSV</button></div>
 <p class="mt-3 text-[10px] text-zinc-500">Demo instruments and prices are generated locally and change randomly. This simulator does not connect to Angel One, does not validate actual lot sizes/contracts, and does not place real orders. Historical performance is not predictive.</p>`;
 root.querySelector('#pl-start').onclick=start;root.querySelector('#pl-pause').onclick=pause;root.querySelector('#pl-auto').onclick=()=>{state.auto=!state.auto;save();render()};root.querySelector('#pl-scan').onclick=()=>{let c=candidate();if(c){lastScan=`Best simulated candidate: ${c.a.s} • projected net ${money(c.net)} • score ${c.score.toFixed(3)}. Manual paper BUY available.`;buy(c,false);}else{lastScan='No simulated candidate passes the ₹250 net-profit gate and available-cash checks.';render();}};
 root.querySelector('#pl-reset').onclick=()=>{if(!confirm('Reset paper cash, positions and history?'))return;pause();let cap=Math.max(1000,Number(root.querySelector('#pl-capital').value)||100000);state={capital:cap,cash:cap,positions:[],history:[],running:false,auto:false};lastScan='Paper account reset.';save();seed();render();};
 root.querySelector('#pl-export').onclick=()=>{let lines=[['Symbol','Qty','Entry','Exit','Gross PnL','Charges','Net PnL','Reason','Closed'],...state.history.map(h=>[h.symbol,h.qty,h.entry,h.exit,h.gross,h.charges,h.net,h.reason,h.closed])];let csv=lines.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='KHAN_AI_TRADER_Paper_Trades.csv';a.click();URL.revokeObjectURL(a.href);};
 root.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{let p=state.positions.find(x=>x.id===b.dataset.close);if(p)close(p,prices[p.symbol],'Manual paper exit')});
 }
 function inject(){if(document.getElementById('khan-paper-lab-v15'))return;let anchor=document.getElementById('khan-smartapi-readiness-card');if(!anchor)return;let section=document.createElement('section');section.id='khan-paper-lab-v15';section.className='mt-4 rounded-2xl border-2 border-amber-300 bg-amber-50 p-4';anchor.insertAdjacentElement('afterend',section);render();}
 const mo=new MutationObserver(inject);mo.observe(document.documentElement,{childList:true,subtree:true});inject();setTimeout(()=>{inject();},3000);
 window.addEventListener('beforeunload',pause);
})();
</script>
</body>
