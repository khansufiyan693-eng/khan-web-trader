<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHAN AI TRADER</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        body { margin: 0; padding: 0; background: #0B0E14; color: #EAECEF; }
        .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; height: 100vh; background: #12161F; }
        
        /* Login Screen */
        #loginScreen { position: fixed; inset: 0; background: #12161F; z-index: 9999; display: flex; flex-direction: column; justify-content: center; padding: 20px; }
        .login-box { background: #181D27; padding: 22px; border-radius: 12px; border: 1px solid #262D3D; }
        .login-title { font-size: 20px; font-weight: 800; color: #3861FB; text-align: center; margin-bottom: 4px; }
        .login-sub { font-size: 12px; color: #848E9C; text-align: center; margin-bottom: 18px; }
        .tabs { display: flex; background: #12161F; padding: 4px; border-radius: 6px; margin-bottom: 16px; }
        .tab { flex: 1; text-align: center; padding: 8px; font-size: 12px; font-weight: 700; color: #848E9C; border-radius: 4px; cursor: pointer; }
        .tab.active { background: #3861FB; color: #FFF; }
        .inp-grp { margin-bottom: 12px; }
        .inp-grp label { display: block; font-size: 12px; color: #848E9C; margin-bottom: 5px; }
        .inp { width: 100%; background: #12161F; border: 1px solid #2B3139; color: #FFF; padding: 12px; border-radius: 6px; font-size: 14px; }
        .btn { border: none; padding: 12px 16px; border-radius: 6px; font-weight: 700; font-size: 14px; cursor: pointer; color: #FFF; width: 100%; }
        .btn-blue { background: #3861FB; }
        .btn-green { background: #0ECB81; color: #000; }
        .btn-red { background: #F6465D; }
        .btn-gray { background: #2B3139; color: #EAECEF; }

        /* Main App */
        .top-bar { background: #181D27; padding: 10px 14px; border-bottom: 1px solid #262D3D; display: flex; justify-content: space-between; align-items: center; }
        .up { color: #0ECB81; font-weight: 700; }
        .down { color: #F6465D; font-weight: 700; }
        .badge { background: #0ECB8122; color: #0ECB81; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; border: 1px solid #0ECB81; }
        .main { flex: 1; overflow-y: auto; padding-bottom: 70px; }
        .list-item { padding: 12px 14px; border-bottom: 1px solid #1E232F; display: flex; justify-content: space-between; align-items: center; }
        .nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: #181D27; border-top: 1px solid #262D3D; display: flex; }
        .nav-btn { flex: 1; padding: 10px 0; text-align: center; color: #848E9C; font-size: 11px; font-weight: 700; cursor: pointer; }
        .nav-btn.active { color: #3861FB; }
        
        /* Order Popup */
        #orderModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 500; justify-content: flex-end; flex-direction: column; }
        .modal-box { background: #181D27; padding: 20px; border-top-left-radius: 16px; border-top-right-radius: 16px; max-width: 480px; width: 100%; margin: 0 auto; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <div class="login-title">KHAN AI TERMINAL</div>
        <div class="login-sub">Angel One Style Paper & Algo Terminal</div>
        
        <div class="tabs">
            <div class="tab active" id="tClient" onclick="setMode('client')">Client ID</div>
            <div class="tab" id="tMobile" onclick="setMode('mobile')">Mobile OTP</div>
        </div>

        <div id="boxClient">
            <div class="inp-grp">
                <label>Client ID</label>
                <input type="text" id="cid" class="inp" value="K892341">
            </div>
            <div class="inp-grp">
                <label>MPIN</label>
                <input type="password" id="mpin" class="inp" value="1234">
            </div>
        </div>

        <div id="boxMobile" style="display:none;">
            <div class="inp-grp">
                <label>Mobile Number</label>
                <input type="tel" id="mob" class="inp" placeholder="10-digit number" maxlength="10">
            </div>
            <div class="inp-grp">
                <label>OTP (Default: 1234)</label>
                <input type="text" id="otp" class="inp" value="1234">
            </div>
        </div>

        <button type="button" class="btn btn-blue" id="loginBtn" onclick="doLogin()">LOGIN NOW</button>
    </div>
</div>

<div class="app">
    <div class="top-bar">
        <div style="font-size:12px;">NIFTY: <span id="nVal" class="up">22,450.00</span></div>
        <div style="font-size:12px;">SENSEX: <span id="sVal" class="up">73,850.00</span></div>
        <div class="badge">LIVE PAPER</div>
    </div>
    <div class="main" id="content"></div>
    <div class="nav">
        <div class="nav-btn active" id="n-watch" onclick="goTab('watch')">Watchlist</div>
        <div class="nav-btn" id="n-algo" onclick="goTab('algo')">AI Algos</div>
        <div class="nav-btn" id="n-pos" onclick="goTab('pos')">Positions</div>
        <div class="nav-btn" id="n-fund" onclick="goTab('fund')">Funds & API</div>
    </div>
</div>

<div id="orderModal">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; margin-bottom:14px;">
            <strong id="mSym" style="font-size:16px;">STOCK</strong>
            <span onclick="closeModal()" style="cursor:pointer; padding:4px 8px; background:#2B3139; border-radius:4px;">✕</span>
        </div>
        <div style="font-size:13px; color:#0ECB81; margin-bottom:12px;" id="mPrice">LTP: ₹0</div>
        <div class="inp-grp">
            <label>Quantity (Min Investment ₹1,000)</label>
            <input type="number" id="mQty" class="inp" value="1" oninput="updateEst()">
        </div>
        <div style="font-size:12px; color:#848E9C; margin-bottom:14px;">Required: <strong id="mReq" style="color:#FFF;">₹0</strong> | Avail: <strong id="mAvl" style="color:#0ECB81;">₹50,000</strong></div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-green" onclick="execOrder('BUY')">BUY</button>
            <button class="btn btn-red" onclick="execOrder('SELL')">SELL</button>
        </div>
    </div>
</div>

<script>
    var tab = 'watch';
    var bal = 50000;
    var nifty = 22450.00;
    var sensex = 73850.00;
    var search = '';
    var selStock = null;
    var posList = [];
    var algoList = [];

    var stocks = [
        { s: 'RELIANCE', e: 'NSE', p: 2985.50 },
        { s: 'TCS', e: 'NSE', p: 3920.00 },
        { s: 'HDFCBANK', e: 'NSE', p: 1542.00 },
        { s: 'TATAMOTORS', e: 'NSE', p: 984.20 },
        { s: 'SBIN', e: 'NSE', p: 765.40 },
        { s: 'SUZLON', e: 'BSE/NSE', p: 46.50 },
        { s: 'ZOMATO', e: 'NSE', p: 185.30 },
        { s: 'ITC', e: 'NSE', p: 432.10 },
        { s: 'INFY', e: 'NSE', p: 1650.50 },
        { s: 'IDEA', e: 'BSE/NSE', p: 14.20 }
    ];

    function setMode(m) {
        document.getElementById('tClient').className = m === 'client' ? 'tab active' : 'tab';
        document.getElementById('tMobile').className = m === 'mobile' ? 'tab active' : 'tab';
        document.getElementById('boxClient').style.display = m === 'client' ? 'block' : 'none';
        document.getElementById('boxMobile').style.display = m === 'mobile' ? 'block' : 'none';
    }

    function doLogin() {
        var screen = document.getElementById('loginScreen');
        if (screen) {
            screen.style.display = 'none';
        }
        draw();
    }

    setInterval(function() {
        nifty = +(nifty + (Math.random() - 0.48) * 10).toFixed(2);
        sensex = +(sensex + (Math.random() - 0.48) * 30).toFixed(2);
        document.getElementById('nVal').innerText = nifty.toLocaleString('en-IN');
        document.getElementById('sVal').innerText = sensex.toLocaleString('en-IN');

        for (var i = 0; i < stocks.length; i++) {
            stocks[i].p = +(stocks[i].p * (1 + (Math.random() - 0.49) * 0.004)).toFixed(2);
        }

        for (var j = 0; j < posList.length; j++) {
            var st = stocks.find(function(x) { return x.s === posList[j].s; });
            if (st) posList[j].ltp = st.p;
        }

        for (var k = 0; k < algoList.length; k++) {
            if (algoList[k].on && Math.random() < 0.15) {
                var targetSt = stocks.find(function(x) { return x.s === algoList[k].s; });
                if (targetSt && bal >= 1000) {
                    var q = Math.max(1, Math.floor(1000 / targetSt.p));
                    var c = +(targetSt.p * q).toFixed(2);
                    bal = +(bal - c).toFixed(2);
                    posList.push({ s: targetSt.s, side: 'BUY', q: q, avg: targetSt.p, ltp: targetSt.p, bot: true });
                }
            }
        }
        draw();
    }, 1500);

    function goTab(t) {
        tab = t;
        var btns = document.querySelectorAll('.nav-btn');
        for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
        document.getElementById('n-' + t).classList.add('active');
        draw();
    }

    function openBuy(sym, price) {
        selStock = { s: sym, p: price };
        document.getElementById('mSym').innerText = sym;
        document.getElementById('mPrice').innerText = 'LTP: ₹' + price;
        var minQ = Math.max(1, Math.ceil(1000 / price));
        document.getElementById('mQty').value = minQ;
        document.getElementById('mAvl').innerText = '₹' + bal.toLocaleString('en-IN');
        updateEst();
        document.getElementById('orderModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('orderModal').style.display = 'none';
    }

    function updateEst() {
        if (!selStock) return;
        var q = parseInt(document.getElementById('mQty').value) || 1;
        document.getElementById('mReq').innerText = '₹' + (selStock.p * q).toFixed(2);
    }

    function execOrder(side) {
        var q = parseInt(document.getElementById('mQty').value) || 1;
        var cost = +(selStock.p * q).toFixed(2);
        if (cost < 1000) { alert('Minimum ₹1,000 ka trade zaroori hai!'); return; }
        if (cost > bal) { alert('Balance kam hai!'); return; }
        bal = +(bal - cost).toFixed(2);
        posList.push({ s: selStock.s, side: side, q: q, avg: selStock.p, ltp: selStock.p, bot: false });
        closeModal();
        goTab('pos');
    }

    function closePos(idx) {
        var p = posList[idx];
        var pnl = p.side === 'BUY' ? (p.ltp - p.avg) * p.q : (p.avg - p.ltp) * p.q;
        bal = +(bal + (p.avg * p.q) + pnl).toFixed(2);
        posList.splice(idx, 1);
        draw();
    }

    function startStockAlgo(sym) {
        for (var i = 0; i < algoList.length; i++) {
            if (algoList[i].s === sym) { alert('Already added!'); return; }
        }
        algoList.push({ s: sym, on: true });
        alert(sym + ' par ₹1,000+ AI Algo chalu ho gaya!');
        goTab('algo');
    }

    function toggleAlgo(idx) {
        algoList[idx].on = !algoList[idx].on;
        draw();
    }

    function draw() {
        var box = document.getElementById('content');
        if (tab === 'watch') {
            var h = '<div style="padding:10px;"><input type="text" class="inp" placeholder="Search BSE/NSE stock..." value="' + search + '" oninput="search=this.value; draw();"></div>';
            for (var i = 0; i < stocks.length; i++) {
                var st = stocks[i];
                if (st.s.toLowerCase().indexOf(search.toLowerCase()) === -1) continue;
                h += '<div class="list-item">' +
                    '<div onclick="openBuy(\'' + st.s + '\',' + st.p + ')" style="flex:1; cursor:pointer;"><strong>' + st.s + '</strong><div style="font-size:11px; color:#848E9C;">' + st.e + ' • Tap to Trade</div></div>' +
                    '<div onclick="openBuy(\'' + st.s + '\',' + st.p + ')" style="margin-right:12px; font-weight:700; color:#0ECB81; cursor:pointer;">₹' + st.p + '</div>' +
                    '<button class="btn btn-blue" style="width:auto; padding:6px 10px; font-size:11px;" onclick="startStockAlgo(\'' + st.s + '\')">+ AI Algo</button>' +
                    '</div>';
            }
            box.innerHTML = h;
        } else if (tab === 'algo') {
            var h = '<div style="padding:14px; font-weight:700;">ACTIVE AI ALGOS (Min ₹1,000)</div>';
            if (algoList.length === 0) h += '<div style="padding:30px; text-align:center; color:#848E9C;">Watchlist me kisi bhi share par "+ AI Algo" dabayein.</div>';
            for (var i = 0; i < algoList.length; i++) {
                var a = algoList[i];
                h += '<div class="list-item"><div><strong>' + a.s + ' AI Bot</strong><div style="font-size:11px; color:#0ECB81;">' + (a.on ? 'RUNNING' : 'PAUSED') + '</div></div>' +
                    '<button class="btn ' + (a.on ? 'btn-red' : 'btn-green') + '" style="width:auto; padding:6px 14px;" onclick="toggleAlgo(' + i + ')">' + (a.on ? 'STOP' : 'START') + '</button></div>';
            }
            box.innerHTML = h;
        } else if (tab === 'pos') {
            var tot = 0;
            for (var i = 0; i < posList.length; i++) {
                var p = posList[i];
                tot += p.side === 'BUY' ? (p.ltp - p.avg) * p.q : (p.avg - p.ltp) * p.q;
            }
            var h = '<div style="padding:16px; text-align:center; background:#181D27;">Total P&L: <strong class="' + (tot >= 0 ? 'up' : 'down') + '" style="font-size:20px;">₹' + tot.toFixed(2) + '</strong></div>';
            for (var i = 0; i < posList.length; i++) {
                var p = posList[i];
                var pnl = p.side === 'BUY' ? (p.ltp - p.avg) * p.q : (p.avg - p.ltp) * p.q;
                h += '<div class="list-item"><div><strong>' + p.s + '</strong> (' + p.q + ' Qty)<div style="font-size:11px; color:#848E9C;">Avg: ₹' + p.avg + (p.bot ? ' • AI Bot' : '') + '</div></div>' +
                    '<div style="text-align:right;"><div class="' + (pnl >= 0 ? 'up' : 'down') + '">₹' + pnl.toFixed(2) + '</div>' +
                    '<button class="btn btn-red" style="width:auto; padding:4px 10px; font-size:11px; margin-top:4px;" onclick="closePos(' + i + ')">EXIT</button></div></div>';
            }
            box.innerHTML = h;
        } else if (tab === 'fund') {
            box.innerHTML = '<div style="padding:20px;"><div style="background:#181D27; padding:16px; border-radius:8px; margin-bottom:16px;">' +
                '<div style="font-size:12px; color:#848E9C;">Available Funds</div><div style="font-size:24px; font-weight:800; color:#0ECB81; margin:8px 0;">₹' + bal.toLocaleString('en-IN') + '</div>' +
                '<button class="btn btn-gray" onclick="bal=50000; posList=[]; draw();">Reset ₹50,000</button></div>' +
                '<div style="background:#181D27; padding:16px; border-radius:8px;"><strong>Angel One SmartAPI Bridge</strong><p style="font-size:12px; color:#848E9C;">API Key milne par yahan connect karein:</p>' +
                '<input type="text" class="inp" placeholder="SmartAPI Key" style="margin-bottom:10px;">' +
                '<button class="btn btn-blue" onclick="alert(\'API Bridge Saved!\')">SAVE API KEY</button></div></div>';
        }
    }
    draw();
</script>
</body>
</html>
