<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHAN AI TRADER - Angel Pro</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; background-color: #0B0E14; color: #EAECEF; }
        .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; height: 100vh; background: #12161F; position: relative; }
        
        .header-top { background: #181D27; padding: 12px 14px; border-bottom: 1px solid #262D3D; display: flex; align-items: center; gap: 10px; }
        .search-box { flex: 1; background: #12161F; border: 1px solid #2B3139; border-radius: 8px; display: flex; align-items: center; padding: 8px 12px; }
        .search-box input { background: transparent; border: none; color: #FFF; font-size: 13px; width: 100%; outline: none; }
        
        .cat-scroll { display: flex; background: #181D27; overflow-x: auto; padding: 0 10px 8px 10px; gap: 16px; border-bottom: 1px solid #262D3D; white-space: nowrap; scrollbar-width: none; }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-item { font-size: 13px; font-weight: 600; color: #848E9C; cursor: pointer; padding-bottom: 4px; }
        .cat-item.active { color: #3861FB; border-bottom: 2px solid #3861FB; }

        .ticker-scroll { display: flex; background: #181D27; padding: 10px 14px; gap: 14px; overflow-x: auto; border-bottom: 1px solid #262D3D; scrollbar-width: none; }
        .ticker-card { background: #151A24; padding: 8px 12px; border-radius: 6px; min-width: 140px; border: 1px solid #262D3D; cursor: pointer; flex-shrink: 0; }
        .ticker-title { font-size: 10px; color: #848E9C; font-weight: 700; display: flex; justify-content: space-between; }
        .ticker-val { font-size: 13px; font-weight: 700; margin-top: 3px; }
        .up { color: #0ECB81; }
        .down { color: #F6465D; }

        .main { flex: 1; overflow-y: auto; padding-bottom: 75px; }
        .section-title { padding: 14px 14px 6px 14px; font-size: 13px; font-weight: 700; color: #848E9C; display: flex; justify-content: space-between; align-items: center; }
        .banner-card { background: linear-gradient(135deg, #1E232F, #181D27); margin: 10px 14px; padding: 14px; border-radius: 10px; border: 1px solid #2B3139; display: flex; justify-content: space-between; align-items: center; }
        
        .stock-row { padding: 12px 14px; border-bottom: 1px solid #1E232F; display: flex; justify-content: space-between; align-items: center; background: #12161F; }
        .stock-row:active { background: #181D27; }
        .s-name { font-size: 14px; font-weight: 700; }
        .s-sub { font-size: 11px; color: #848E9C; margin-top: 2px; }
        .s-price-col { text-align: right; }
        .s-ltp { font-size: 14px; font-weight: 700; }
        .s-chg { font-size: 11px; margin-top: 2px; }

        .btn { border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; color: #FFF; }
        .btn-blue { background: #3861FB; }
        .btn-green { background: #0ECB81; color: #000; }
        .btn-red { background: #F6465D; }
        .btn-gray { background: #2B3139; color: #EAECEF; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: #181D27; border-top: 1px solid #262D3D; display: flex; z-index: 40; }
        .nav-item { flex: 1; padding: 8px 0; text-align: center; color: #848E9C; font-size: 10px; font-weight: 600; cursor: pointer; }
        .nav-item.active { color: #3861FB; }
        .nav-icon { font-size: 18px; display: block; margin-bottom: 2px; }

        .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; justify-content: flex-end; flex-direction: column; }
        .drawer { background: #181D27; border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 20px; max-width: 480px; width: 100%; margin: 0 auto; border-top: 1px solid #2B3139; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #262D3D; padding-bottom: 12px; margin-bottom: 14px; }
        .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .input-box { background: #12161F; border: 1px solid #2B3139; color: #FFF; padding: 8px 12px; border-radius: 6px; width: 120px; text-align: right; font-size: 15px; font-weight: 700; }
    </style>
</head>
<body>

<div class="app">
    <div class="header-top">
        <div class="search-box">
            <span style="margin-right:8px; color:#848E9C;">🔍</span>
            <input type="text" id="globalSearch" placeholder="Search for Nifty, Stocks, F&O..." oninput="handleSearchInput(this.value)">
        </div>
        <div style="font-size:20px; cursor:pointer;" onclick="setTab('account')">👤</div>
    </div>

    <div class="cat-scroll">
        <div class="cat-item active" onclick="setTab('home')">Stocks</div>
        <div class="cat-item" onclick="setTab('options')">F&O</div>
        <div class="cat-item" onclick="setTab('portfolio')">Mutual Funds</div>
        <div class="cat-item" onclick="alert('Loans Section Active')">Loans</div>
        <div class="cat-item" onclick="alert('Commodity Section Active')">Commodity</div>
    </div>

    <div class="ticker-scroll">
        <div class="ticker-card" onclick="setTab('options')">
            <div class="ticker-title"><span>NIFTY 50</span><span style="color:#0ECB81;">Live</span></div>
            <div id="tkNifty" class="ticker-val up">25,144.30</div>
            <div style="font-size:10px; color:#F6465D; margin-top:2px;">-155.05 (-0.61%)</div>
        </div>
        <div class="ticker-card" onclick="setTab('options')">
            <div class="ticker-title"><span>SENSEX</span><span style="color:#0ECB81;">Live</span></div>
            <div id="tkSensex" class="ticker-val up">81,592.45</div>
            <div style="font-size:10px; color:#F6465D; margin-top:2px;">-318.56 (-0.39%)</div>
        </div>
        <div class="ticker-card" onclick="setTab('options')">
            <div class="ticker-title"><span>BANKNIFTY</span><span style="color:#0ECB81;">Live</span></div>
            <div id="tkBank" class="ticker-val up">51,420.10</div>
            <div style="font-size:10px; color:#0ECB81; margin-top:2px;">+112.40 (+0.22%)</div>
        </div>
    </div>

    <div class="main" id="mainScreen"></div>

    <div class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="setTab('home')"><span class="nav-icon">🏠</span>HOME</div>
        <div class="nav-item" id="nav-watchlist" onclick="setTab('watchlist')"><span class="nav-icon">⭐</span>WATCHLIST</div>
        <div class="nav-item" id="nav-portfolio" onclick="setTab('portfolio')"><span class="nav-icon">💼</span>PORTFOLIO</div>
        <div class="nav-item" id="nav-orders" onclick="setTab('orders')"><span class="nav-icon">📋</span>ORDERS</div>
        <div class="nav-item" id="nav-account" onclick="setTab('account')"><span class="nav-icon">👤</span>ACCOUNT</div>
    </div>
</div>

<div class="drawer-overlay" id="orderDrawer">
    <div class="drawer">
        <div class="drawer-header">
            <div>
                <div id="ordSymbol" style="font-size:16px; font-weight:700;">RELIANCE</div>
                <div id="ordLtp" style="font-size:12px; color:#0ECB81; margin-top:2px;">LTP: ₹ 2,985.50</div>
            </div>
            <button class="btn btn-gray" onclick="closeOrderDrawer()">✕</button>
        </div>

        <div class="input-row">
            <span style="font-size:13px; color:#848E9C;">Quantity (Min ₹1,000 Invest)</span>
            <input type="number" id="ordQty" class="input-box" value="1" min="1" oninput="calcOrderCost()">
        </div>

        <div style="display:flex; justify-content:space-between; background:#12161F; padding:10px; border-radius:6px; font-size:12px; margin-bottom:14px;">
            <span style="color:#848E9C;">Total Cost: <strong id="ordTotalCost" style="color:#FFF;">₹ 0</strong></span>
            <span style="color:#848E9C;">Balance: <strong id="ordBal" style="color:#0ECB81;">₹ 50,000</strong></span>
        </div>

        <div style="display:flex; gap:10px;">
            <button class="btn btn-green" style="flex:1; padding:14px;" onclick="executeTrade('BUY')">BUY</button>
            <button class="btn btn-red" style="flex:1; padding:14px;" onclick="executeTrade('SELL')">SELL</button>
        </div>
    </div>
</div>

<script>
    let currentTab = 'home';
    let balance = 50000;
    let niftyPrice = 25144.30;
    let sensexPrice = 81592.45;
    let bankNifty = 51420.10;
    let portfolioPositions = [];
    let aiAlgos = [];
    let searchTerm = '';
    let selectedContract = null;

    let allStocks = [
        { sym: 'RELIANCE', exch: 'NSE EQ', price: 2985.50, base: 2950 },
        { sym: 'TCS', exch: 'NSE EQ', price: 3920.00, base: 3900 },
        { sym: 'HDFCBANK', exch: 'NSE EQ', price: 1542.00, base: 1535 },
        { sym: 'INFY', exch: 'NSE EQ', price: 1650.50, base: 1640 },
        { sym: 'TATAMOTORS', exch: 'NSE EQ', price: 984.20, base: 975 },
        { sym: 'SBIN', exch: 'NSE EQ', price: 765.40, base: 758 },
        { sym: 'SUZLON', exch: 'BSE/NSE', price: 46.50, base: 45.00 },
        { sym: 'ZOMATO', exch: 'NSE EQ', price: 185.30, base: 180 },
        { sym: 'ITC', exch: 'NSE EQ', price: 432.10, base: 430 },
        { sym: 'ICICIBANK', exch: 'NSE EQ', price: 1090.00, base: 1080 },
        { sym: 'BHARTIARTL', exch: 'NSE EQ', price: 1240.00, base: 1230 },
        { sym: 'ADANIENT', exch: 'NSE EQ', price: 3150.00, base: 3100 },
        { sym: 'TATAPOWER', exch: 'NSE EQ', price: 410.50, base: 405 },
        { sym: 'IDEA', exch: 'BSE/NSE', price: 14.20, base: 14.00 },
        { sym: 'POLICYBZR', exch: 'NSE EQ', price: 1105.00, base: 1050 },
        { sym: 'MCX', exch: 'NSE EQ', price: 3720.00, base: 3620 },
        { sym: 'GVT&D', exch: 'NSE EQ', price: 4420.00, base: 4200 },
        { sym: 'KARURVYSYA', exch: 'NSE EQ', price: 381.55, base: 380 },
        { sym: 'SYLPH', exch: 'BSE/NSE', price: 0.22, base: 0.22 },
        { sym: 'SMT', exch: 'NSE EQ', price: 533.95, base: 504 },
        { sym: 'CUPID', exch: 'NSE EQ', price: 377.80, base: 384 },
        { sym: 'UTLSOLAR', exch: 'NSE EQ', price: 347.05, base: 355 },
        { sym: 'NMDC', exch: 'NSE EQ', price: 69.80, base: 71 },
        { sym: 'PCJEWELLER', exch: 'NSE EQ', price: 15.50, base: 15.9 }
    ];

    setInterval(() => {
        niftyPrice = +(niftyPrice + (Math.random() - 0.48) * 12).toFixed(2);
        sensexPrice = +(sensexPrice + (Math.random() - 0.48) * 35).toFixed(2);
        bankNifty = +(bankNifty + (Math.random() - 0.48) * 25).toFixed(2);

        document.getElementById('tkNifty').innerText = niftyPrice.toLocaleString('en-IN');
        document.getElementById('tkSensex').innerText = sensexPrice.toLocaleString('en-IN');
        document.getElementById('tkBank').innerText = bankNifty.toLocaleString('en-IN');

        allStocks.forEach(s => {
            s.price = +(s.price * (1 + (Math.random() - 0.49) * 0.004)).toFixed(2);
        });

        portfolioPositions.forEach(p => {
            let found = allStocks.find(x => x.sym === p.sym);
            if (found) p.ltp = found.price;
        });

        aiAlgos.forEach(a => {
            if (a.active && Math.random() < 0.12) {
                let st = allStocks.find(x => x.sym === a.sym);
                if (st && balance >= 1000) {
                    let qty = Math.max(1, Math.floor(1000 / st.price));
                    let cost = st.price * qty;
                    balance -= cost;
                    portfolioPositions.push({
                        sym: st.sym,
                        side: 'BUY',
                        qty: qty,
                        avg: st.price,
                        ltp: st.price,
                        source: 'AI Algo'
                    });
                }
            }
        });

        renderScreen();
    }, 1500);

    function setTab(tabName) {
        currentTab = tabName;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        let activeEl = document.getElementById('nav-' + tabName);
        if (activeEl) activeEl.classList.add('active');
        renderScreen();
    }

    function handleSearchInput(val) {
        searchTerm = val;
        if (currentTab !== 'watchlist' && currentTab !== 'home') {
            setTab('watchlist');
        } else {
            renderScreen();
        }
    }

    function openOrderDrawer(sym, price) {
        selectedContract = { sym, price };
        document.getElementById('ordSymbol').innerText = sym;
        document.getElementById('ordLtp').innerText = 'LTP: ₹ ' + price.toFixed(2);
        let minQty = Math.max(1, Math.ceil(1000 / price));
        document.getElementById('ordQty').value = minQty;
        document.getElementById('ordBal').innerText = '₹ ' + balance.toLocaleString('en-IN');
        calcOrderCost();
        document.getElementById('orderDrawer').style.display = 'flex';
    }

    function closeOrderDrawer() {
        document.getElementById('orderDrawer').style.display = 'none';
    }

    function calcOrderCost() {
        if (!selectedContract) return;
        let q = parseInt(document.getElementById('ordQty').value) || 1;
        let total = +(selectedContract.price * q).toFixed(2);
        document.getElementById('ordTotalCost').innerText = '₹ ' + total.toLocaleString('en-IN');
    }

    function executeTrade(side) {
        let q = parseInt(document.getElementById('ordQty').value) || 1;
        let cost = +(selectedContract.price * q).toFixed(2);
        if (cost < 1000) {
            alert('Minimum trade amount ₹1,000 zaroori hai!');
            return;
        }
        if (cost > balance) {
            alert('Insufficient balance!');
            return;
        }
        balance = +(balance - cost).toFixed(2);
        portfolioPositions.push({
            sym: selectedContract.sym,
            side: side,
            qty: q,
            avg: selectedContract.price,
            ltp: selectedContract.price,
            source: 'Manual Trade'
        });
        closeOrderDrawer();
        setTab('portfolio');
    }

    function closePosition(idx) {
        let pos = portfolioPositions[idx];
        let pnl = pos.side === 'BUY' ? (pos.ltp - pos.avg) * pos.qty : (pos.avg - pos.ltp) * pos.qty;
        let refund = (pos.avg * pos.qty) + pnl;
        balance = +(balance + refund).toFixed(2);
        portfolioPositions.splice(idx, 1);
        renderScreen();
    }

    function toggleStockAlgo(sym) {
        let existing = aiAlgos.find(x => x.sym === sym);
        if (existing) {
            existing.active = !existing.active;
        } else {
            aiAlgos.push({ sym: sym, active: true });
        }
        alert('AI Algorithm status updated for ' + sym);
        setTab('watchlist');
    }

    function renderScreen() {
        let screen = document.getElementById('mainScreen');
        let filtered = allStocks.filter(s => s.sym.toLowerCase().includes(searchTerm.toLowerCase()));

        if (currentTab === 'home') {
            let h = `
                <div class="banner-card">
                    <div>
                        <div style="font-size:14px; font-weight:700;">Get a loan of upto ₹10 lakhs instantly!</div>
                        <div style="font-size:12px; color:#3861FB; margin-top:4px;">Check Offer ></div>
                    </div>
                    <div style="font-size:24px;">🏦</div>
                </div>

                <div class="section-title"><span>Stocks You're Interested In</span><span style="color:#3861FB; font-size:11px;" onclick="setTab('watchlist')">View All ></span></div>
            `;
            for (let i = 0; i < 3 && i < filtered.length; i++) {
                let s = filtered[i];
                let diff = +(s.price - s.base).toFixed(2);
                let pct = +((diff / s.base) * 100).toFixed(2);
                let isUp = diff >= 0;
                h += `
                    <div class="stock-row" onclick="openOrderDrawer('${s.sym}', ${s.price})">
                        <div>
                            <div class="s-name">${s.sym}</div>
                            <div class="s-sub">${s.exch}</div>
                        </div>
                        <div class="s-price-col">
                            <div class="s-ltp ${isUp ? 'up' : 'down'}">₹ ${s.price.toLocaleString('en-IN')}</div>
                            <div class="s-chg ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${diff} (${pct}%)</div>
                        </div>
                    </div>
                `;
            }

            h += `<div class="section-title"><span>Top Movers & Gainers</span></div>`;
            for (let i = 3; i < 6 && i < filtered.length; i++) {
                let s = filtered[i];
                let diff = +(s.price - s.base).toFixed(2);
                let pct = +((diff / s.base) * 100).toFixed(2);
                let isUp = diff >= 0;
                h += `
                    <div class="stock-row" onclick="openOrderDrawer('${s.sym}', ${s.price})">
                        <div>
                            <div class="s-name">${s.sym}</div>
                            <div class="s-sub">${s.exch}</div>
                        </div>
                        <div class="s-price-col">
                            <div class="s-ltp ${isUp ? 'up' : 'down'}">₹ ${s.price.toLocaleString('en-IN')}</div>
                            <div class="s-chg ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${diff} (${pct}%)</div>
                        </div>
                    </div>
                `;
            }
            screen.innerHTML = h;

        } else if (currentTab === 'watchlist') {
            let h = `<div class="section-title"><span>All BSE / NSE Watchlist (${filtered.length} Shares)</span></div>`;
            filtered.forEach(s => {
                let diff = +(s.price - s.base).toFixed(2);
                let pct = +((diff / s.base) * 100).toFixed(2);
                let isUp = diff >= 0;
                let algoActive = aiAlgos.some(x => x.sym === s.sym && x.active);
                h += `
                    <div class="stock-row">
                        <div onclick="openOrderDrawer('${s.sym}', ${s.price})" style="flex:1; cursor:pointer;">
                            <div class="s-name">${s.sym}</div>
                            <div class="s-sub">${s.exch} • Tap to Trade</div>
                        </div>
                        <div class="s-price-col" onclick="openOrderDrawer('${s.sym}', ${s.price})" style="margin-right:12px; cursor:pointer;">
                            <div class="s-ltp ${isUp ? 'up' : 'down'}">₹ ${s.price.toLocaleString('en-IN')}</div>
                            <div class="s-chg ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${diff} (${pct}%)</div>
                        </div>
                        <button class="btn ${algoActive ? 'btn-red' : 'btn-blue'}" style="padding:5px 8px; font-size:10px;" onclick="toggleStockAlgo('${s.sym}')">${algoActive ? 'Stop Algo' : '+ AI Algo'}</button>
                    </div>
                `;
            });
            screen.innerHTML = h;

        } else if (currentTab === 'options') {
            let atm = Math.round(niftyPrice / 50) * 50;
            let strikes = [atm-100, atm-50, atm, atm+50, atm+100];
            let h = `
                <div style="padding:14px; background:#181D27; font-weight:700; border-bottom:1px solid #262D3D; display:flex; justify-content:space-between;">
                    <span>NIFTY OPTION CHAIN (F&O)</span>
