<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHAN PRO TERMINAL - Angel One Style</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; background-color: #0B0E14; color: #EAECEF; }
        .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; height: 100vh; background: #12161F; position: relative; }
        
        /* Top Ticker Bar */
        .top-bar { background: #181D27; padding: 8px 12px; border-bottom: 1px solid #262D3D; display: flex; overflow-x: auto; gap: 14px; white-space: nowrap; scrollbar-width: none; }
        .top-bar::-webkit-scrollbar { display: none; }
        .idx-pill { background: #12161F; padding: 6px 10px; border-radius: 6px; border: 1px solid #262D3D; font-size: 11px; cursor: pointer; flex-shrink: 0; }
        .idx-pill.active-idx { border-color: #3861FB; background: #3861FB18; }
        .up { color: #0ECB81; font-weight: 700; }
        .down { color: #F6465D; font-weight: 700; }

        /* Navigation Tabs */
        .nav-tabs { display: flex; background: #181D27; border-bottom: 1px solid #262D3D; overflow-x: auto; scrollbar-width: none; }
        .n-tab { flex: 1; text-align: center; padding: 10px 8px; font-size: 12px; font-weight: 700; color: #848E9C; cursor: pointer; white-space: nowrap; }
        .n-tab.active { color: #3861FB; border-bottom: 2px solid #3861FB; }

        /* Main Area */
        .main { flex: 1; overflow-y: auto; padding-bottom: 75px; }

        /* Search & Cards */
        .search-box { padding: 10px 12px; background: #181D27; border-bottom: 1px solid #262D3D; }
        .inp { width: 100%; background: #12161F; border: 1px solid #2B3139; color: #FFF; padding: 10px; border-radius: 6px; font-size: 13px; outline: none; }
        .stock-row { padding: 11px 14px; border-bottom: 1px solid #1E232F; display: flex; justify-content: space-between; align-items: center; }
        
        /* Buttons */
        .btn { border: none; padding: 7px 12px; border-radius: 5px; font-weight: 700; font-size: 11px; cursor: pointer; color: #FFF; }
        .btn-blue { background: #3861FB; }
        .btn-green { background: #0ECB81; color: #000; }
        .btn-red { background: #F6465D; }
        .btn-gray { background: #2B3139; color: #EAECEF; }

        /* Candlestick Chart Box */
        .chart-container { background: #151A24; padding: 10px; border-bottom: 1px solid #262D3D; }
        canvas { width: 100%; height: 210px; display: block; background: #0E121A; border-radius: 6px; }
        .level-badges { display: flex; justify-content: space-between; font-size: 11px; margin-top: 8px; background: #12161F; padding: 6px 10px; border-radius: 5px; }

        /* Bottom Nav */
        .b-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: #181D27; border-top: 1px solid #262D3D; display: flex; z-index: 50; }
        .b-btn { flex: 1; padding: 10px 0; text-align: center; color: #848E9C; font-size: 10px; font-weight: 700; cursor: pointer; }
        .b-btn.active { color: #3861FB; }

        /* Modal Drawer */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 100; justify-content: flex-end; flex-direction: column; }
        .modal-card { background: #181D27; padding: 18px; border-top-left-radius: 16px; border-top-right-radius: 16px; max-width: 480px; width: 100%; margin: 0 auto; border-top: 1px solid #2B3139; }
        .row-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
    </style>
</head>
<body>

<div class="app">
    <!-- Top All-Market Indices Ticker -->
    <div class="top-bar" id="topTicker"></div>

    <!-- Top Sub-Tabs -->
    <div class="nav-tabs">
        <div class="n-tab active" id="tab-watch" onclick="switchTab('watch')">Shares (55+)</div>
        <div class="n-tab" id="tab-options" onclick="switchTab('options')">Option Chain</div>
        <div class="n-tab" id="tab-chart" onclick="switchTab('chart')">Live Chart & Levels</div>
        <div class="n-tab" id="tab-algo" onclick="switchTab('algo')">AI Algos</div>
        <div class="n-tab" id="tab-pos" onclick="switchTab('pos')">Positions</div>
    </div>

    <!-- Main Content -->
    <div class="main" id="mainContainer"></div>

    <!-- Bottom Navigation -->
    <div class="b-nav">
        <div class="b-btn active" id="b-watch" onclick="switchTab('watch')">📋 Watchlist</div>
        <div class="b-btn" id="b-options" onclick="switchTab('options')">⛓️ F&O / Crude</div>
        <div class="b-btn" id="b-chart" onclick="switchTab('chart')">🕯️ Chart</div>
        <div class="b-btn" id="b-pos" onclick="switchTab('pos')">💼 Portfolio</div>
        <div class="b-btn" id="b-acc" onclick="switchTab('acc')">📜 History & API</div>
    </div>
</div>

<!-- Order Execution & Algo Setup Modal -->
<div class="modal-overlay" id="orderModal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #262D3D; padding-bottom:10px; margin-bottom:12px;">
            <div>
                <strong id="mSym" style="font-size:16px;">SYMBOL</strong>
                <div style="font-size:12px; color:#0ECB81;" id="mPrice">LTP: ₹0</div>
            </div>
            <span onclick="closeModal()" style="cursor:pointer; padding:4px 10px; background:#2B3139; border-radius:4px;">✕</span>
        </div>

        <div class="row-between">
            <span style="color:#848E9C;">Quantity (Min ₹1,000 Trade)</span>
            <input type="number" id="mQty" class="inp" style="width:110px; text-align:right; font-weight:700;" value="1" oninput="updateOrderCalc()">
        </div>
        <div class="row-between">
            <span style="color:#848E9C;">Target Price (₹)</span>
            <input type="number" id="mTarget" class="inp" style="width:110px; text-align:right; color:#0ECB81; font-weight:700;" step="0.5">
        </div>
        <div class="row-between">
            <span style="color:#848E9C;">Stop Loss Price (₹)</span>
            <input type="number" id="mSL" class="inp" style="width:110px; text-align:right; color:#F6465D; font-weight:700;" step="0.5">
        </div>

        <div style="background:#12161F; padding:10px; border-radius:6px; font-size:11px; margin-bottom:14px; line-height:1.6;">
            <div style="display:flex; justify-content:space-between;"><span>Trade Value:</span><strong id="mCost">₹0</strong></div>
            <div style="display:flex; justify-content:space-between; color:#F0B90B;"><span>Angel Brokerage + STT/GST:</span><strong id="mBrok">₹23.60</strong></div>
            <div style="display:flex; justify-content:space-between; color:#0ECB81;"><span>Available Capital:</span><strong>₹<span id="mBal">50,000</span></strong></div>
        </div>

        <div style="display:flex; gap:8px; margin-bottom:8px;">
            <button class="btn btn-green" style="flex:1; padding:12px; font-size:13px;" onclick="executeManual('BUY')">MANUAL BUY</button>
            <button class="btn btn-red" style="flex:1; padding:12px; font-size:13px;" onclick="executeManual('SELL')">MANUAL SELL</button>
        </div>
        <button class="btn btn-blue" style="width:100%; padding:12px; font-size:13px;" onclick="deploySmartAlgo()">🤖 ACTIVATE SMART BREAKOUT ALGO (BUY/SELL)</button>
    </div>
</div>

<script>
    // Persistent State Loader (Prevents reset on refresh)
    let savedState = JSON.parse(localStorage.getItem('khan_pro_terminal_v1')) || null;

    let balance = savedState ? savedState.balance : 50000.00;
    let totalBrokeragePaid = savedState ? savedState.totalBrokeragePaid : 0.00;
    let positions = savedState ? savedState.positions : [];
    let historyLogs = savedState ? savedState.historyLogs : [];
    let activeAlgos = savedState ? savedState.activeAlgos : [];
    let apiConfig = savedState ? savedState.apiConfig : { client: '', key: '', connected: false };

    let currentTab = 'watch';
    let selectedIndex = 'NIFTY';
    let searchTxt = '';
    let modalAsset = null;

    // All Major Indices & Commodities
    let indices = {
        'NIFTY': { price: 25144.30, step: 50, lot: 25 },
        'BANKNIFTY': { price: 51420.50, step: 100, lot: 15 },
        'SENSEX': { price: 81592.45, step: 100, lot: 10 },
        'GIFTNIFTY': { price: 25210.00, step: 50, lot: 25 },
        'CRUDEOIL': { price: 5840.00, step: 50, lot: 10 }
    };

    // 55+ Popular NSE & BSE Shares
    let stocks = [
        { sym: 'RELIANCE', exch: 'NSE', p: 2985.50 }, { sym: 'TCS', exch: 'NSE', p: 3920.00 },
        { sym: 'HDFCBANK', exch: 'NSE', p: 1542.00 }, { sym: 'ICICIBANK', exch: 'NSE', p: 1090.00 },
        { sym: 'INFY', exch: 'NSE', p: 1650.50 }, { sym: 'SBIN', exch: 'NSE', p: 765.40 },
        { sym: 'BHARTIARTL', exch: 'NSE', p: 1240.00 }, { sym: 'ITC', exch: 'NSE', p: 432.10 },
        { sym: 'LT', exch: 'NSE', p: 3540.00 }, { sym: 'HINDUNILVR', exch: 'NSE', p: 2410.00 },
        { sym: 'TATAMOTORS', exch: 'NSE', p: 984.20 }, { sym: 'AXISBANK', exch: 'NSE', p: 1120.50 },
        { sym: 'KOTAKBANK', exch: 'NSE', p: 1780.00 }, { sym: 'BAJFINANCE', exch: 'NSE', p: 6850.00 },
        { sym: 'MARUTI', exch: 'NSE', p: 12450.00 }, { sym: 'SUNPHARMA', exch: 'NSE', p: 1580.00 },
        { sym: 'TITAN', exch: 'NSE', p: 3420.00 }, { sym: 'ADANIENT', exch: 'NSE', p: 3150.00 },
        { sym: 'ADANIPORTS', exch: 'NSE', p: 1340.00 }, { sym: 'NTPC', exch: 'NSE', p: 365.20 },
        { sym: 'POWERGRID', exch: 'NSE', p: 295.40 }, { sym: 'ONGC', exch: 'NSE', p: 274.80 },
        { sym: 'COALINDIA', exch: 'NSE', p: 452.10 }, { sym: 'TATASTEEL', exch: 'NSE', p: 162.40 },
        { sym: 'JSWSTEEL', exch: 'NSE', p: 895.00 }, { sym: 'HINDALCO', exch: 'NSE', p: 642.30 },
        { sym: 'WIPRO', exch: 'NSE', p: 485.60 }, { sym: 'HCLTECH', exch: 'NSE', p: 1490.00 },
        { sym: 'TECHM', exch: 'NSE', p: 1310.00 }, { sym: 'ULTRACEMCO', exch: 'NSE', p: 9850.00 },
        { sym: 'GRASIM', exch: 'NSE', p: 2340.00 }, { sym: 'ASIANPAINT', exch: 'NSE', p: 2890.00 },
        { sym: 'BAJAJFINSV', exch: 'NSE', p: 1610.00 }, { sym: 'NESTLEIND', exch: 'NSE', p: 2510.00 },
        { sym: 'DRREDDY', exch: 'NSE', p: 6120.00 }, { sym: 'CIPLA', exch: 'NSE', p: 1420.00 },
        { sym: 'DIVISLAB', exch: 'NSE', p: 3780.00 }, { sym: 'APOLLOHOSP', exch: 'NSE', p: 6210.00 },
        { sym: 'EICHERMOT', exch: 'NSE', p: 4560.00 }, { sym: 'HEROMOTOCO', exch: 'NSE', p: 4720.00 },
        { sym: 'M&M', exch: 'NSE', p: 2150.00 }, { sym: 'BAJAJ-AUTO', exch: 'NSE', p: 8940.00 },
        { sym: 'BRITANNIA', exch: 'NSE', p: 4920.00 }, { sym: 'INDUSINDBK', exch: 'NSE', p: 1480.00 },
        { sym: 'ZOMATO', exch: 'NSE', p: 185.30 }, { sym: 'PAYTM', exch: 'NSE', p: 412.50 },
        { sym: 'NYKAA', exch: 'NSE', p: 172.40 }, { sym: 'POLICYBZR', exch: 'NSE', p: 1105.00 },
        { sym: 'SUZLON', exch: 'BSE/NSE', p: 46.50 }, { sym: 'IDEA', exch: 'BSE/NSE', p: 14.20 },
        { sym: 'YESBANK', exch: 'BSE/NSE', p: 24.80 }, { sym: 'IRCTC', exch: 'NSE', p: 985.00 },
        { sym: 'RVNL', exch: 'BSE/NSE', p: 285.40 }, { sym: 'IRFC', exch: 'BSE/NSE', p: 152.60 },
        { sym: 'HAL', exch: 'NSE', p: 3890.00 }, { sym: 'BEL', exch: 'NSE', p: 235.40 },
        { sym: 'TATAPOWER', exch: 'NSE', p: 410.50 }, { sym: 'NHPC', exch: 'BSE/NSE', p: 92.30 }
    ];

    // Candlestick History Buffer
    let candles = [];
    let baseC = 25120;
    for (let i = 0; i < 24; i++) {
        let o = baseC;
        let c = +(o + (Math.random() - 0.48) * 25).toFixed(2);
        let h = +(Math.max(o, c) + Math.random() * 12).toFixed(2);
        let l = +(Math.min(o, c) - Math.random() * 12).toFixed(2);
        candles.push({ o, h, l, c });
        baseC = c;
    }

    function saveToStorage() {
        localStorage.setItem('khan_pro_terminal_v1', JSON.stringify({
            balance, totalBrokeragePaid, positions, historyLogs, activeAlgos, apiConfig
        }));
    }

    function calcAngelBrokerage(turnover) {
        // Angel One model: ₹20 flat per order + ~0.08% STT/Exchange/SEBI/GST
        let brok = 20;
        let taxes = +(turnover * 0.0008).toFixed(2);
        return +(brok + taxes).toFixed(2);
    }

    // Live Market Simulation & Smart Breakout Algo Engine
    setInterval(() => {
        // Update Indices
        Object.keys(indices).forEach(k => {
            let delta = (Math.random() - 0.48) * (indices[k].price * 0.0012);
            indices[k].price = +(indices[k].price + delta).toFixed(2);
        });

        // Update Candles for Selected Index/Chart
        let lastC = candles[candles.length - 1];
        let newC = +(lastC.c + (Math.random() - 0.48) * 18).toFixed(2);
        let newH = +(Math.max(lastC.o, newC) + Math.random() * 8).toFixed(2);
        let newL = +(Math.min(lastC.o, newC) - Math.random() * 8).toFixed(2);
        candles.push({ o: lastC.c, h: newH, l: newL, c: newC });
        if (candles.length > 26) candles.shift();

        // Update Stocks
        stocks.forEach(s => {
            s.p = +(s.p * (1 + (Math.random() - 0.49) * 0.004)).toFixed(2);
        });

        // Update Open Positions & Check Target / Stop Loss Auto-Exit
        for (let i = positions.length - 1; i >= 0; i--) {
            let p = positions[i];
            let stObj = stocks.find(x => x.sym === p.sym);
            if (stObj) {
                p.ltp = stObj.p;
            } else {
                p.ltp = Math.max(2, +(p.ltp + (Math.random() - 0.48) * 4.5).toFixed(2));
            }

            // Target & SL Check
            if (p.side === 'BUY') {
                if (p.ltp >= p.target) closeTrade(i, 'TARGET HIT 🎯');
                else if (p.ltp <= p.sl) closeTrade(i, 'STOP LOSS HIT 🛑');
            } else {
                if (p.ltp <= p.target) closeTrade(i, 'TARGET HIT 🎯');
                else if (p.ltp >= p.sl) closeTrade(i, 'STOP LOSS HIT 🛑');
            }
        }

        // Smart Breakout Algo Check (Enters ONLY on strong candle momentum)
        let prevCandle = candles[candles.length - 2];
        let currCandle = candles[candles.length - 1];
        let bullishBreakout = currCandle.c > prevCandle.h;
        let bearishBreakout = currCandle.c < prevCandle.l;

        activeAlgos.forEach(algo => {
            if (!algo.running) return;
            let alreadyOpen = positions.some(x => x.sym === algo.sym);
            if (alreadyOpen) return;

            // Get live price of algo target
            let livePrice = algo.price;
            let foundSt = stocks.find(x => x.sym === algo.sym);
            if (foundSt) livePrice = foundSt.p;
            else livePrice = Math.max(15, +(algo.price + (Math.random() - 0.48) * 10).toFixed(2));

            let turnover = livePrice * algo.qty;
            let charges = calcAngelBrokerage(turnover);

            if ((bullishBreakout || bearishBreakout) && balance >= (turnover + charges)) {
                let signalSide = bullishBreakout ? 'BUY' : 'SELL';
                let targetP = signalSide === 'BUY' ? +(livePrice * 1.03).toFixed(2) : +(livePrice * 0.97).toFixed(2);
                let slP = signalSide === 'BUY' ? +(livePrice * 0.985).toFixed(2) : +(livePrice * 1.015).toFixed(2);

                balance = +(balance - turnover - charges).toFixed(2);
                totalBrokeragePaid = +(totalBrokeragePaid + charges).toFixed(2);

                positions.push({
                    sym: algo.sym,
                    side: signalSide,
                    qty: algo.qty,
                    avg: livePrice,
                    ltp: livePrice,
                    target: targetP,
                    sl: slP,
                    charges: charges,
                    mode: 'AI Breakout Algo'
                });
                saveToStorage();
            }
        });

        renderTopTicker();
        if (currentTab === 'chart') drawCandlestickChart();
        else if (currentTab === 'pos' || currentTab === 'watch' || currentTab === 'options') renderMain();
    }, 1500);

    function renderTopTicker() {
        let bar = document.getElementById('topTicker');
        let h = '';
        Object.keys(indices).forEach(k => {
            let activeCls = selectedIndex === k ? 'active-idx' : '';
            h += `<div class="idx-pill ${activeCls}" onclick="selectedIndex='${k}'; renderTopTicker(); renderMain();">
                <div style="color:#848E9C; font-size:9px;">${k}</div>
                <div class="up">₹${indices[k].price.toLocaleString('en-IN')}</div>
            </div>`;
        });
        bar.innerHTML = h;
    }

    function switchTab(t) {
        currentTab = t;
        document.querySelectorAll('.n-tab').forEach(el => el.classList.remove('active'));
        let topEl = document.getElementById('tab-' + t);
        if (topEl) topEl.classList.add('active');

        document.querySelectorAll('.b-btn').forEach(el => el.classList.remove('active'));
        let botEl = document.getElementById('b-' + t);
        if (botEl) botEl.classList.add('active');

        renderMain();
    }

    function openOrderModal(sym, price, defaultQty = null) {
        modalAsset = { sym, price };
        document.getElementById('mSym').innerText = sym;
        document.getElementById('mPrice').innerText = 'Live Price: ₹ ' + price.toFixed(2);
        document.getElementById('mBal').innerText = balance.toLocaleString('en-IN');

        let q = defaultQty ? defaultQty : Math.max(1, Math.ceil(1000 / price));
        document.getElementById('mQty').value = q;
        document.getElementById('mTarget').value = +(price * 1.03).toFixed(2);
        document.getElementById('mSL').value = +(price * 0.985).toFixed(2);

        updateOrderCalc();
        document.getElementById('orderModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('orderModal').style.display = 'none';
    }

    function updateOrderCalc() {
        if (!modalAsset) return;
        let q = parseInt(document.getElementById('mQty').value) || 1;
        let val = +(modalAsset.price * q).toFixed(2);
        let brok = calcAngelBrokerage(val);
        document.getElementById('mCost').innerText = '₹ ' + val.toLocaleString('en-IN');
        document.getElementById('mBrok').innerText = '₹ ' + brok.toFixed(2);
    }

    function executeManual(side) {
        let q = parseInt(document.getElementById('mQty').value) || 1;
        let cost = +(modalAsset.price * q).toFixed(2);
        let charges = calcAngelBrokerage(cost);
        let target = parseFloat(document.getElementById('mTarget').value);
        let sl = parseFloat(document.getElementById('mSL').value);

        if (cost < 1000) { alert('Minimum ₹1,000 ka trade lagana zaroori hai!'); return; }
        if ((cost + charges) > balance) { alert('Balance kam hai! Available: ₹' + balance); return; }

        balance = +(balance - cost - charges).toFixed(2);
        totalBrokeragePaid = +(totalBrokeragePaid + charges).toFixed(2);

        positions.push({
            sym: modalAsset.sym,
            side: side,
            qty: q,
            avg: modalAsset.price,
            ltp: modalAsset.price,
            target: target,
            sl: sl,
            charges: charges,
            mode: 'Manual'
        });

        saveToStorage();
        closeModal();
        switchTab('chart');
    }

    function deploySmartAlgo() {
        let q = parseInt(document.getElementById('mQty').value) || 1;
        let cost = +(modalAsset.price * q).toFixed(2);
        if (cost < 1000) { alert('Algo ke liye minimum ₹1,000 capital set karein!'); return; }

        let existing = activeAlgos.find(x => x.sym === modalAsset.sym);
        if (existing) {
            existing.running = true;
            existing.qty = q
