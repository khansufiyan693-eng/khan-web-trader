<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHAN PRO TERMINAL</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; background-color: #0B0E14; color: #EAECEF; }
        .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; height: 100vh; background: #12161F; position: relative; }
        
        .top-bar { background: #181D27; padding: 10px 12px; border-bottom: 1px solid #262D3D; display: flex; overflow-x: auto; gap: 10px; white-space: nowrap; scrollbar-width: none; }
        .top-bar::-webkit-scrollbar { display: none; }
        .idx-pill { background: #12161F; padding: 6px 12px; border-radius: 6px; border: 1px solid #262D3D; font-size: 11px; cursor: pointer; flex-shrink: 0; }
        .idx-pill.active { border-color: #3861FB; background: #3861FB18; }
        .up { color: #0ECB81; font-weight: 700; }
        .down { color: #F6465D; font-weight: 700; }

        .nav-tabs { display: flex; background: #181D27; border-bottom: 1px solid #262D3D; overflow-x: auto; scrollbar-width: none; }
        .n-tab { flex: 1; text-align: center; padding: 10px 10px; font-size: 11px; font-weight: 700; color: #848E9C; cursor: pointer; white-space: nowrap; }
        .n-tab.active { color: #3861FB; border-bottom: 2px solid #3861FB; }

        .main { flex: 1; overflow-y: auto; padding-bottom: 75px; background: #12161F; }
        .search-box { padding: 10px 12px; background: #181D27; border-bottom: 1px solid #262D3D; }
        .inp { width: 100%; background: #12161F; border: 1px solid #2B3139; color: #FFF; padding: 10px; border-radius: 6px; font-size: 13px; outline: none; }
        .stock-row { padding: 12px 14px; border-bottom: 1px solid #1E232F; display: flex; justify-content: space-between; align-items: center; }
        
        .btn { border: none; padding: 8px 12px; border-radius: 5px; font-weight: 700; font-size: 11px; cursor: pointer; color: #FFF; }
        .btn-blue { background: #3861FB; }
        .btn-green { background: #0ECB81; color: #000; }
        .btn-red { background: #F6465D; }
        .btn-gray { background: #2B3139; color: #EAECEF; }

        .b-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: #181D27; border-top: 1px solid #262D3D; display: flex; z-index: 50; }
        .b-btn { flex: 1; padding: 10px 0; text-align: center; color: #848E9C; font-size: 10px; font-weight: 700; cursor: pointer; }
        .b-btn.active { color: #3861FB; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: flex-end; flex-direction: column; }
        .modal-card { background: #181D27; padding: 20px; border-top-left-radius: 16px; border-top-right-radius: 16px; max-width: 480px; width: 100%; margin: 0 auto; border-top: 1px solid #2B3139; }
        .row-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
    </style>
</head>
<body onload="initApp()">

<div class="app">
    <div class="top-bar" id="topTickerBar"></div>

    <div class="nav-tabs">
        <div class="n-tab active" id="t-home" onclick="changeTab('home')">Home</div>
        <div class="n-tab" id="t-watch" onclick="changeTab('watch')">Watchlist</div>
        <div class="n-tab" id="t-options" onclick="changeTab('options')">Option Chain</div>
        <div class="n-tab" id="t-chart" onclick="changeTab('chart')">Chart</div>
        <div class="n-tab" id="t-algos" onclick="changeTab('algos')">AI Algos</div>
    </div>

    <div class="main" id="mainArea"></div>

    <div class="b-nav">
        <div class="b-btn active" id="b-home" onclick="changeTab('home')"><span style="display:block; font-size:16px;">🏠</span>HOME</div>
        <div class="b-btn" id="b-watch" onclick="changeTab('watch')"><span style="display:block; font-size:16px;">⭐</span>WATCHLIST</div>
        <div class="b-btn" id="b-pos" onclick="changeTab('pos')"><span style="display:block; font-size:16px;">💼</span>PORTFOLIO</div>
        <div class="b-btn" id="b-algos" onclick="changeTab('algos')"><span style="display:block; font-size:16px;">🤖</span>ALGO BOTS</div>
        <div class="b-btn" id="b-acc" onclick="changeTab('acc')"><span style="display:block; font-size:16px;">👤</span>ACCOUNT</div>
    </div>
</div>

<div class="modal-overlay" id="orderModal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #262D3D; padding-bottom:10px; margin-bottom:12px;">
            <div>
                <strong id="mSym" style="font-size:16px;">SYMBOL</strong>
                <div style="font-size:12px; color:#0ECB81;" id="mPrice">LTP: ₹0</div>
            </div>
            <button class="btn btn-gray" onclick="closeModal()">✕</button>
        </div>

        <div class="row-between">
            <span style="color:#848E9C;">Quantity (Min ₹1,000)</span>
            <input type="number" id="mQty" class="inp" style="width:110px; text-align:right; font-weight:700;" value="1" oninput="calcCost()">
        </div>
        <div class="row-between">
            <span style="color:#848E9C;">Target Price (₹)</span>
            <input type="number" id="mTarget" class="inp" style="width:110px; text-align:right; color:#0ECB81; font-weight:700;" step="0.5">
        </div>
        <div class="row-between">
            <span style="color:#848E9C;">Stop Loss (₹)</span>
            <input type="number" id="mSL" class="inp" style="width:110px; text-align:right; color:#F6465D; font-weight:700;" step="0.5">
        </div>

        <div style="background:#12161F; padding:10px; border-radius:6px; font-size:11px; margin-bottom:14px;">
            <div style="display:flex; justify-content:space-between;"><span>Investment:</span><strong id="mCost">₹0</strong></div>
            <div style="display:flex; justify-content:space-between; color:#F0B90B;"><span>Brokerage + Taxes:</span><strong id="mBrok">₹23.60</strong></div>
            <div style="display:flex; justify-content:space-between; color:#0ECB81;"><span>Balance:</span><strong>₹<span id="mBal">50000</span></strong></div>
        </div>

        <div style="display:flex; gap:8px; margin-bottom:8px;">
            <button class="btn btn-green" style="flex:1; padding:12px;" onclick="placeManual('BUY')">MANUAL BUY</button>
            <button class="btn btn-red" style="flex:1; padding:12px;" onclick="placeManual('SELL')">MANUAL SELL</button>
        </div>
        <button class="btn btn-blue" style="width:100%; padding:12px;" onclick="activateAlgo()">🤖 ACTIVATE SMART BREAKOUT ALGO</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('khan_terminal_v4')) || {
        balance: 50000,
        totalBrokerage: 0,
        positions: [],
        history: [],
        algos: []
    };

    let currentTab = 'home';
    let selIndex = 'NIFTY';
    let searchKey = '';
    let currentAsset = null;

    let indices = {
        'NIFTY': { price: 25144.30, step: 50 },
        'BANKNIFTY': { price: 51420.50, step: 100 },
        'SENSEX': { price: 81592.45, step: 100 },
        'GIFTNIFTY': { price: 25210.00, step: 50 },
        'CRUDEOIL': { price: 5840.00, step: 50 }
    };

    let stocks = [
        { sym: 'RELIANCE', exch: 'NSE', p: 2985.50 }, { sym: 'TCS', exch: 'NSE', p: 3920.00 },
        { sym: 'HDFCBANK', exch: 'NSE', p: 1542.00 }, { sym: 'ICICIBANK', exch: 'NSE', p: 1090.00 },
        { sym: 'INFY', exch: 'NSE', p: 1650.50 }, { sym: 'SBIN', exch: 'NSE', p: 765.40 },
        { sym: 'BHARTIARTL', exch: 'NSE', p: 1240.00 }, { sym: 'ITC', exch: 'NSE', p: 432.10 },
        { sym: 'TATAMOTORS', exch: 'NSE', p: 984.20 }, { sym: 'AXISBANK', exch: 'NSE', p: 1120.50 },
        { sym: 'KOTAKBANK', exch: 'NSE', p: 1780.00 }, { sym: 'BAJFINANCE', exch: 'NSE', p: 6850.00 },
        { sym: 'MARUTI', exch: 'NSE', p: 12450.00 }, { sym: 'SUNPHARMA', exch: 'NSE', p: 1580.00 },
        { sym: 'TITAN', exch: 'NSE', p: 3420.00 }, { sym: 'ADANIENT', exch: 'NSE', p: 3150.00 },
        { sym: 'NTPC', exch: 'NSE', p: 365.20 }, { sym: 'ONGC', exch: 'NSE', p: 274.80 },
        { sym: 'TATASTEEL', exch: 'NSE', p: 162.40 }, { sym: 'WIPRO', exch: 'NSE', p: 485.60 },
        { sym: 'HCLTECH', exch: 'NSE', p: 1490.00 }, { sym: 'ULTRACEMCO', exch: 'NSE', p: 9850.00 },
        { sym: 'ASIANPAINT', exch: 'NSE', p: 2890.00 }, { sym: 'ZOMATO', exch: 'NSE', p: 185.30 },
        { sym: 'PAYTM', exch: 'NSE', p: 412.50 }, { sym: 'SUZLON', exch: 'BSE/NSE', p: 46.50 },
        { sym: 'IDEA', exch: 'BSE/NSE', p: 14.20 }, { sym: 'YESBANK', exch: 'BSE/NSE', p: 24.80 },
        { sym: 'IRCTC', exch: 'NSE', p: 985.00 }, { sym: 'RVNL', exch: 'BSE/NSE', p: 285.40 },
        { sym: 'IRFC', exch: 'BSE/NSE', p: 152.60 }, { sym: 'HAL', exch: 'NSE', p: 3890.00 },
        { sym: 'BEL', exch: 'NSE', p: 235.40 }, { sym: 'TATAPOWER', exch: 'NSE', p: 410.50 }
    ];

    let candles = [];
    let baseVal = 25100;
    for (let i = 0; i < 22; i++) {
        let o = baseVal;
        let c = +(o + (Math.random() - 0.48) * 20).toFixed(2);
        let h = +(Math.max(o, c) + Math.random() * 10).toFixed(2);
        let l = +(Math.min(o, c) - Math.random() * 10).toFixed(2);
        candles.push({ o, h, l, c });
        baseVal = c;
    }

    function persist() {
        localStorage.setItem('khan_terminal_v4', JSON.stringify(db));
    }

    function calcBrok(turnover) {
        return +(20 + (turnover * 0.0008)).toFixed(2);
    }

    setInterval(() => {
        Object.keys(indices).forEach(k => {
            indices[k].price = +(indices[k].price + (Math.random() - 0.48) * (indices[k].price * 0.001)).toFixed(2);
        });
        stocks.forEach(s => {
            s.p = +(s.p * (1 + (Math.random() - 0.49) * 0.003)).toFixed(2);
        });

        for (let i = db.positions.length - 1; i >= 0; i--) {
            let p = db.positions[i];
            let st = stocks.find(x => x.sym === p.sym);
            p.ltp = st ? st.p : Math.max(5, +(p.ltp + (Math.random() - 0.48) * 3).toFixed(2));

            if (p.side === 'BUY') {
                if (p.ltp >= p.target) exitPos(i, 'TARGET HIT 🎯');
                else if (p.ltp <= p.sl) exitPos(i, 'STOP LOSS HIT 🛑');
            } else {
                if (p.ltp <= p.target) exitPos(i, 'TARGET HIT 🎯');
                else if (p.ltp >= p.sl) exitPos(i, 'STOP LOSS HIT 🛑');
            }
        }

        renderTicker();
        if (currentTab === 'chart') drawChart();
        else renderMain();
    }, 1500);

    function initApp() {
        renderTicker();
        renderMain();
    }

    function renderTicker() {
        let bar = document.getElementById('topTickerBar');
        if (!bar) return;
        let h = '';
        Object.keys(indices).forEach(k => {
            let cls = selIndex === k ? 'active' : '';
            h += `<div class="idx-pill ${cls}" onclick="selIndex='${k}'; renderTicker();">
                <div style="color:#848E9C; font-size:9px;">${k}</div>
                <div class="up">₹${indices[k].price.toLocaleString('en-IN')}</div>
            </div>`;
        });
        bar.innerHTML = h;
    }

    function changeTab(t) {
        currentTab = t;
        document.querySelectorAll('.n-tab').forEach(el => el.classList.remove('active'));
        let topEl = document.getElementById('t-' + t);
        if (topEl) topEl.classList.add('active');

        document.querySelectorAll('.b-btn').forEach(el => el.classList.remove('active'));
        let botEl = document.getElementById('b-' + t);
        if (botEl) botEl.classList.add('active');

        renderMain();
    }

    function openModal(sym, price, qty = 1) {
        currentAsset = { sym, price };
        document.getElementById('mSym').innerText = sym;
        document.getElementById('mPrice').innerText = 'Live Price: ₹ ' + price.toFixed(2);
        document.getElementById('mBal').innerText = db.balance.toLocaleString('en-IN');
        document.getElementById('mQty').value = Math.max(qty, Math.ceil(1000 / price));
        document.getElementById('mTarget').value = +(price * 1.03).toFixed(2);
        document.getElementById('mSL').value = +(price * 0.985).toFixed(2);
        calcCost();
        document.getElementById('orderModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('orderModal').style.display = 'none';
    }

    function calcCost() {
        if (!currentAsset) return;
        let q = parseInt(document.getElementById('mQty').value) || 1;
        let val = +(currentAsset.price * q).toFixed(2);
        let brok = calcBrok(val);
        document.getElementById('mCost').innerText = '₹ ' + val.toLocaleString('en-IN');
        document.getElementById('mBrok').innerText = '₹ ' + brok.toFixed(2);
    }

    function placeManual(side) {
        let q = parseInt(document.getElementById('mQty').value) || 1;
        let cost = +(currentAsset.price * q).toFixed(2);
        let charges = calcBrok(cost);
        let target = parseFloat(document.getElementById('mTarget').value);
        let sl = parseFloat(document.getElementById('mSL').value);

        if (cost < 1000) { alert('Minimum ₹1,000 ka trade zaroori hai!'); return; }
        if ((cost + charges) > db.balance) { alert('Insufficient balance!'); return; }

        db.balance = +(db.balance - cost - charges).toFixed(2);
        db.totalBrokerage = +(db.totalBrokerage + charges).toFixed(2);
        db.positions.push({
            sym: currentAsset.sym,
            side: side,
            qty: q,
            avg: currentAsset.price,
            ltp: currentAsset.price,
            target: target,
            sl: sl,
            charges: charges,
            mode: 'Manual'
        });

        persist();
        closeModal();
        changeTab('pos');
    }

    function activateAlgo() {
        let q = parseInt(document.getElementById('mQty').value) || 1;
        let cost = +(currentAsset.price * q).toFixed(2);
        if (cost < 1000) { alert('Minimum ₹1,000 capital zaroori hai!'); return; }

        let ex = db.algos.find(x => x.sym === currentAsset.sym);
        if (ex) { ex.active = true; ex.qty = q; }
        else { db.algos.push({ sym: currentAsset.sym, price: currentAsset.price, qty: q, active: true }); }

        persist();
        closeModal();
        alert(`Smart Breakout Algo activated for ${currentAsset.sym}!`);
        changeTab('algos');
    }

    function exitPos(idx, reason = 'Manual Exit') {
        let p = db.positions[idx];
        let gross = p.side === 'BUY' ? (p.ltp - p.avg) * p.qty : (p.avg - p.ltp) * p.qty;
        let exitChg = calcBrok(p.ltp * p.qty);
        let net = +(gross - exitChg).toFixed(2);

        db.balance = +(db.balance + (p.avg * p.qty) + net).toFixed(2);
        db.totalBrokerage = +(db.totalBrokerage + exitChg).toFixed(2);

        db.history.unshift({
            time: new Date().toLocaleTimeString(),
            sym: p.sym,
            side: p.side,
            qty: p.qty,
            inP: p.avg,
            outP: p.ltp,
            net: net,
            reason: reason
        });

        db.positions.splice(idx, 1);
        persist();
        renderMain();
    }

    function drawChart() {
        let canvas = document.getElementById('chartCanvas');
        if (!canvas) return;
        let ctx = canvas.getContext('2d');
        let w = canvas.width = canvas.offsetWidth;
        let h = canvas.height = 200;
        ctx.clearRect(0, 0, w, h);

        let prices = candles.flatMap(c => [c.h, c.l]);
        let pos = db.positions[0];
        if (pos) prices.push(pos.avg, pos.target, pos.sl);

        let minP = Math.min(...prices) - 5;
        let maxP = Math.max(...prices) + 5;
        const getY = (p) => h - ((p - minP) / (maxP - minP)) * (h - 20) - 10;

        let cw = (w / candles.length) * 0.6;
        candles.forEach((c, i) => {
            let x = (i + 0.5) * (w / candles.length);
            let bull = c.c >= c.o;
            ctx.strokeStyle = ctx.fillStyle = bull ? '#0ECB81' : '#F6465D';

            ctx.beginPath(); ctx.moveTo(x, getY(c.h)); ctx.lineTo(x, getY(c.l)); ctx.stroke();
            ctx.fillRect(x - cw / 2, getY(Math.max(c.o, c.c)), cw, Math.max(2, Math.abs(getY(c.o) - getY(c.c))));
        });

        if (pos) {
            ctx.strokeStyle = '#3861FB'; ctx.setLineDash([3,3]);
            ctx.beginPath(); ctx.moveTo(0, getY(pos.avg)); ctx.lineTo(w, getY(pos.avg)); ctx.stroke();
            ctx.strokeStyle = '#0ECB81';
            ctx.beginPath(); ctx.moveTo(0, getY(pos.target)); ctx.lineTo(w, getY(pos.target)); ctx.stroke();
            ctx.strokeStyle = '#F6465D';
            ctx.beginPath(); ctx.moveTo(0, getY(pos.sl)); ctx.lineTo(w, getY(pos.sl)); ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    function renderMain() {
        let box = document.getElementById('mainArea');
        if (!box) return;

        if (currentTab === 'home') {
            box.innerHTML = `
                <div style="padding:16px;">
                    <div style="background:linear-gradient(135deg, #1E232F, #181D27); padding:16px; border-radius:10px; border:1px solid #2B3139; margin-bottom:14px;">
                        <div style="font-size:14px; font-weight:700;">Welcome to KHAN PRO TERMINAL</div>
                        <div style="font-size:12px; color:#848E9C; margin-top:4px;">Angel One Style Live Paper & Algo Trading</div>
                    </div>
                    <div style="font-weight:700; font-size:13px; color:#848E9C; margin-bottom:8px;">QUICK MARKET WATCH</div>
            `;
            for (let i = 0; i < 4; i++) {
                let s = stocks[i];
                box.innerHTML += `
                    <div class="stock-row" onclick="openModal('${s.sym}', ${s.p})">
                        <div>
                            <div style="font-weight:700;">${s.sym}</div>
                            <div style="font-size:11px; color:#848E9C;">${s.exch}</div>
                        </div>
                        <div style="text-align:right;"><div class="up">₹${s.p}</div></div>
                    </div>
                `;
            }
            box.innerHTML += `</div>`;

        } else if (currentTab === 'watch') {
            let filtered = stocks.filter(s => s.sym.toLowerCase().includes(searchKey.toLowerCase()));
            let h = `<div class="search-box"><input type="text" class="inp" placeholder="Search 55+ Shares..." value="${searchKey}" oninput="searchKey=this.value; renderMain();"></div>`;
            filtered.forEach(s => {
                h += `<div class="stock-row">
                    <div onclick="openModal('${s.sym}', ${s.p})" style="flex:1; cursor:pointer;">
                        <div style="font-weight:700;">${s.sym}</div>
                        <div style="font-size:11px; color:#848E9C;">${s.exch} • Tap to Trade</div>
                    </div>
                    <div style="text-align:right; margin-right:10px;"><div class="up">₹${s.p}</div></div>
                    <button class="btn btn-blue" onclick="openModal('${s.sym}', ${s.p})">Trade</button>
                </div>`;
            });
            box.innerHTML = h;

        } else if (currentTab === 'options') {
            let idx = indices[selIndex];
            let atm = Math.round(idx.price / idx.step) * idx.step;
            let strikes = [atm - idx.step*2, atm - idx.step, atm, idx.step + atm, idx.step*2 + atm];

            let h = `<div style="padding:12px; background:#181D27; font-weight:700; display:flex; justify-content:space-between;">
                <span>${selIndex} OPTION CHAIN</span><span style="color:#F0B90B;">Spot: ₹${idx.price}</span>
            </div>
            <div style="disp
