<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHAN ULTIMATE PRO TERMINAL</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; background-color: #0B0E14; color: #EAECEF; }
        .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; height: 100vh; background: #12161F; position: relative; }
        
        /* Top Status Bar */
        .top-status { background: #181D27; padding: 10px 14px; border-bottom: 1px solid #262D3D; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .up { color: #0ECB81; font-weight: 700; }
        .down { color: #F6465D; font-weight: 700; }

        /* Navigation Tabs */
        .nav-tabs { display: flex; background: #181D27; border-bottom: 1px solid #262D3D; }
        .tab-btn { flex: 1; text-align: center; padding: 10px 4px; font-size: 11px; font-weight: 700; color: #848E9C; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #3861FB; border-bottom-color: #3861FB; background: #151A24; }

        /* Main Content View */
        .content { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 80px; }
        .card { background: #181D27; border: 1px solid #262D3D; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
        
        /* Inputs & Buttons */
        .inp { width: 100%; background: #12161F; border: 1px solid #2B3139; color: #FFF; padding: 10px; border-radius: 6px; font-size: 13px; outline: none; margin-top: 4px; }
        .btn { border: none; padding: 10px 14px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; color: #FFF; width: 100%; }
        .btn-blue { background: #3861FB; }
        .btn-green { background: #0ECB81; color: #000; }
        .btn-red { background: #F6465D; }
        .btn-gray { background: #2B3139; color: #EAECEF; }

        /* Bottom Menu */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: #181D27; border-top: 1px solid #262D3D; display: flex; z-index: 100; }
        .b-item { flex: 1; text-align: center; padding: 10px 0; font-size: 10px; font-weight: 700; color: #848E9C; cursor: pointer; }
        .b-item.active { color: #3861FB; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; justify-content: flex-end; flex-direction: column; }
        .modal-box { background: #181D27; padding: 20px; border-top-left-radius: 16px; border-top-right-radius: 16px; border-top: 1px solid #2B3139; max-width: 480px; width: 100%; margin: 0 auto; }
    </style>
</head>
<body onload="initApp()">

<div class="app">
    <!-- Top Status Bar -->
    <div class="top-status">
        <div>Capital: <strong style="color:#0ECB81;">₹<span id="lblCap">5000</span></strong></div>
        <div>Daily P&L: <strong id="lblPnl" class="up">₹0.00</strong></div>
        <div>Limit: <span style="color:#F6465D;">₹200 Max</span></div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <div class="tab-btn active" id="tab-opt" onclick="switchTab('opt')">Option Chain</div>
        <div class="tab-btn" id="tab-pos" onclick="switchTab('pos')">Positions</div>
        <div class="tab-btn" id="tab-rules" onclick="switchTab('rules')">4 Exit Rules</div>
        <div class="tab-btn" id="tab-hist" onclick="switchTab('hist')">History</div>
    </div>

    <!-- Dynamic Content Area -->
    <div class="content" id="mainContent"></div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="b-item active" id="b-opt" onclick="switchTab('opt')">⛓️ F&O chain</div>
        <div class="b-item" id="b-pos" onclick="switchTab('pos')">💼 Positions</div>
        <div class="b-item" id="b-rules" onclick="switchTab('rules')">🛡️ Risk Rules</div>
        <div class="b-item" id="b-hist" onclick="switchTab('hist')">📜 Audit Trail</div>
    </div>
</div>

<!-- Trade Execution Modal -->
<div class="modal" id="tradeModal">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; border-bottom:1px solid #262D3D; padding-bottom:8px;">
            <div>
                <strong id="mTitle" style="font-size:15px;">NIFTY 25100 CE</strong>
                <div style="font-size:11px; color:#0ECB81;" id="mLtp">LTP: ₹100</div>
            </div>
            <button class="btn btn-gray" style="width:auto; padding:4px 10px;" onclick="closeModal()">✕</button>
        </div>

        <div style="margin-bottom:10px;">
            <label style="font-size:11px; color:#848E9C;">Lot Size & Quantity (Lot = 25)</label>
            <input type="number" id="mQty" class="inp" value="25" step="25" oninput="calcRiskReward()">
        </div>
        <div style="margin-bottom:10px;">
            <label style="font-size:11px; color:#0ECB81;">Profit Target (₹)</label>
            <input type="number" id="mTarget" class="inp" step="0.5">
        </div>
        <div style="margin-bottom:10px;">
            <label style="font-size:11px; color:#F6465D;">Protective Stop Loss (₹)</label>
            <input type="number" id="mSL" class="inp" step="0.5">
        </div>

        <div style="background:#12161F; padding:8px; border-radius:6px; font-size:11px; margin-bottom:12px; color:#848E9C;">
            <div>Max Risk Allowed Per Trade: <strong style="color:#FFF;">₹100</strong></div>
            <div>Estimated Trade Risk: <strong id="mRiskCalc" style="color:#F6465D;">₹0</strong></div>
        </div>

        <div style="display:flex; gap:8px;">
            <button class="btn btn-green" onclick="executeTrade('BUY')">APPROVE & BUY</button>
        </div>
    </div>
</div>

<script>
    // State Management with LocalStorage persistence
    let db = JSON.parse(localStorage.getItem('khan_terminal_v5')) || {
        capital: 5000,
        dailyPnl: 0,
        positions: [],
        history: []
    };

    let currentTab = 'opt';
    let spotPrice = 25144.30;
    let selectedContract = null;

    function initApp() {
        updateStatus();
        switchTab('opt');
    }

    function persist() {
        localStorage.setItem('khan_terminal_v5', JSON.stringify(db));
        updateStatus();
    }

    function updateStatus() {
        document.getElementById('lblCap').innerText = db.capital.toLocaleString('en-IN');
        let pnlEl = document.getElementById('lblPnl');
        pnlEl.innerText = (db.dailyPnl >= 0 ? '+' : '') + '₹' + db.dailyPnl.toFixed(2);
        pnlEl.className = db.dailyPnl >= 0 ? 'up' : 'down';
    }

    function switchTab(t) {
        currentTab = t;
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.b-item').forEach(el => el.classList.remove('active'));
        
        let tBtn = document.getElementById('tab-' + t);
        let bBtn = document.getElementById('b-' + t);
        if(tBtn) tBtn.classList.add('active');
        if(bBtn) bBtn.classList.add('active');

        renderContent();
    }

    // Live Tick & 4 Exit Rules Engine
    setInterval(() => {
        spotPrice = +(spotPrice + (Math.random() - 0.48) * 10).toFixed(2);

        // Update active positions & evaluate exit rules
        for (let i = db.positions.length - 1; i >= 0; i--) {
            let p = db.positions[i];
            // Simulate price movement for option contract
            p.ltp = +(p.ltp + (Math.random() - 0.49) * 2.5).toFixed(2);
            p.highPrice = Math.max(p.highPrice, p.ltp);

            let currentPnl = (p.ltp - p.avg) * p.qty;

            // Rule 3: Trailing Stop Loss (automatically shifts SL up as profit increases)
            if (currentPnl > (p.avg * p.qty * 0.02) && p.ltp > (p.avg + 3)) {
                let newTrailSL = +(p.ltp - 3).toFixed(2);
                if (newTrailSL > p.sl) {
                    p.sl = newTrailSL;
                    p.exitReason = 'Trailing Stop Loss Triggered 📈';
                }
            }

            // Rule 2: Early Weakness Exit (if profit was high but pulled back sharply)
            let maxProfitSoFar = (p.highPrice - p.avg) * p.qty;
            if (maxProfitSoFar > 50 && currentPnl < (maxProfitSoFar * 0.4)) {
                closePosition(i, 'Early Weakness Exit (Profit Pullback) ⚡');
                continue;
            }

            // Rule 1: Profit Target Hit
            if (p.ltp >= p.target) {
                closePosition(i, 'Profit Target Hit 🎯');
                continue;
            }

            // Rule 4: Protective Stop Loss Hit
            if (p.ltp <= p.sl) {
                closePosition(i, 'Protective Stop Loss Hit 🛑');
                continue;
            }
        }

        // Daily Loss Limit Enforcement (₹200 Limit)
        if (db.dailyPnl <= -200) {
            if (db.positions.length > 0) {
                db.positions = [];
                alert('Daily Loss Limit of ₹200 reached! All positions auto-closed to protect capital.');
                persist();
            }
        }

        if (currentTab === 'pos') renderContent();
    }, 1500);

    function openTradeModal(sym, ltp) {
        selectedContract = { sym, ltp };
        document.getElementById('mTitle').innerText = sym;
        document.getElementById('mLtp').innerText = 'LTP: ₹' + ltp;
        document.getElementById('mQty').value = 25; // 1 Lot Nifty
        document.getElementById('mTarget').value = +(ltp * 1.15).toFixed(2);
        document.getElementById('mSL').value = +(ltp * 0.92).toFixed(2);
        calcRiskReward();
        document.getElementById('tradeModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('tradeModal').style.display = 'none';
    }

    function calcRiskReward() {
        let qty = parseInt(document.getElementById('mQty').value) || 25;
        let ltp = selectedContract.ltp;
        let sl = parseFloat(document.getElementById('mSL').value) || (ltp * 0.92);
        let risk = +( (ltp - sl) * qty ).toFixed(2);
        document.getElementById('mRiskCalc').innerText = '₹' + risk;
    }

    function executeTrade(side) {
        if (db.dailyPnl <= -200) {
            alert('Daily Loss Limit (₹200) exceeded! New trades blocked for today.');
            closeModal();
            return;
        }

        let qty = parseInt(document.getElementById('mQty').value) || 25;
        let ltp = selectedContract.ltp;
        let target = parseFloat(document.getElementById('mTarget').value);
        let sl = parseFloat(document.getElementById('mSL').value);
        let risk = (ltp - sl) * qty;

        // Max Risk Check per Trade (₹100 limit check)
        if (risk > 100) {
            alert('Risk per trade exceeds ₹100 limit! Kripya Stop Loss adjust karein.');
            return;
        }

        let investment = ltp * qty;
        if (investment > db.capital) {
            alert('Insufficient Paper Capital!');
            return;
        }

        db.capital = +(db.capital - investment).toFixed(2);
        db.positions.push({
            sym: selectedContract.sym,
            side: side,
            qty: qty,
            avg: ltp,
            ltp: ltp,
            highPrice: ltp,
            target: target,
            sl: sl,
            time: new Date().toLocaleTimeString()
        });

        persist();
        closeModal();
        switchTab('pos');
    }

    function closePosition(idx, reason) {
        let p = db.positions[idx];
        let pnl = (p.ltp - p.avg) * p.qty;
        let refund = (p.avg * p.qty) + pnl;

        db.capital = +(db.capital + refund).toFixed(2);
        db.dailyPnl = +(db.dailyPnl + pnl).toFixed(2);

        db.history.unshift({
            time: new Date().toLocaleTimeString(),
            sym: p.sym,
            qty: p.qty,
            inP: p.avg,
            outP: p.ltp,
            pnl: +pnl.toFixed(2),
            reason: reason || p.exitReason || 'Manual Exit'
        });

        db.positions.splice(idx, 1);
        persist();
    }

    function renderContent() {
        let box = document.getElementById('mainContent');
        if (!box) return;

        if (currentTab === 'opt') {
            let atm = Math.round(spotPrice / 50) * 50;
            let strikes = [atm-100, atm-50, atm, atm+50, atm+100];
            
            let h = `
                <div class="card">
                    <div style="font-weight:700; margin-bottom:4px;">NIFTY OPTION CHAIN (F&O)</div>
                    <div style="font-size:12px; color:#0ECB81;">Spot Index: ₹${spotPrice} | Expiry: Current Thu</div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 0.8fr 1fr; text-align:center; background:#181D27; padding:8px; font-size:11px; color:#848E9C; font-weight:700; border-radius:6px; margin-bottom:8px;">
                    <div>CALL (CE)</div><div>STRIKE</div><div>PUT (PE)</div>
                </div>
            `;
            strikes.forEach(st => {
                let ceLtp = +(120 + Math.random() * 20).toFixed(2);
                let peLtp = +(110 + Math.random() * 20).toFixed(2);
                h += `
                    <div style="display:grid; grid-template-columns:1fr 0.8fr 1fr; text-align:center; background:#181D27; border:1px solid #262D3D; padding:10px; border-radius:6px; margin-bottom:6px; font-size:13px; align-items:center;">
                        <div class="up" style="cursor:pointer;" onclick="openTradeModal('NIFTY ${st} CE', ${ceLtp})">₹${ceLtp}</div>
                        <div style="font-weight:700; color:#F0B90B;">${st}</div>
                        <div class="down" style="cursor:pointer;" onclick="openTradeModal('NIFTY ${st} PE', ${peLtp})">₹${peLtp}</div>
                    </div>
                `;
            });
            box.innerHTML = h;

        } else if (currentTab === 'pos') {
            let h = `<div style="font-weight:700; margin-bottom:10px; font-size:13px;">ACTIVE POSITIONS & LIVE MTM</div>`;
            if (db.positions.length === 0) {
                h += `<div class="card" style="text-align:center; color:#848E9C; padding:30px;">No open trades. Option Chain se trade execute karein.</div>`;
            } else {
                db.positions.forEach((p, idx) => {
                    let pnl = (p.ltp - p.avg) * p.qty;
                    h += `
                        <div class="card">
                            <div class="row">
                                <strong>${p.sym}</strong>
                                <span class="${pnl >= 0 ? 'up' : 'down'}" style="font-size:14px;">${pnl >= 0 ? '+' : ''}₹${pnl.toFixed(2)}</span>
                            </div>
                            <div style="font-size:11px; color:#848E9C; margin-bottom:6px;">
                                Qty: ${p.qty} | Entry: ₹${p.avg} | LTP: ₹${p.ltp}
                            </div>
                            <div style="font-size:11px; background:#12161F; padding:6px; border-radius:4px; margin-bottom:8px; color:#F0B90B;">
                                🎯 Target: ₹${p.target} | 🛡️ SL: ₹${p.sl} (Trailing Active)
                            </div>
                            <button class="btn btn-red" style="padding:6px; font-size:11px;" onclick="closePosition(${idx}, 'Manual Exit')">EXIT NOW</button>
                        </div>
                    `;
                });
            }
            box.innerHTML = h;

        } else if (currentTab === 'rules') {
            box.innerHTML = `
                <div class="card">
                    <div style="font-weight:700; color:#3861FB; margin-bottom:8px;">🛡️ 4 IMPORTANT EXIT RULES</div>
                    <ul style="padding-left:16px; font-size:12px; color:#848E9C; line-height:1.6;">
                        <li><strong style="color:#FFF;">1. Profit Target:</strong> Kursi par target hit hote hi automatic paper book.</li>
                        <li><strong style="color:#FFF;">2. Early Weakness Exit:</strong> Agar profit peak se girne lage toh weakness detect karke exit.</li>
                        <li><strong style="color:#FFF;">3. Trailing Stop Loss:</strong> Price upar jaane par SL automatically upar shift hota hai.</li>
                        <li><strong style="color:#FFF;">4. Protective Stop Loss:</strong> Nuksan ko limit karne ke liye strict SL exit.</li>
                    </ul>
                </div>
                <div class="card">
                    <div style="font-weight:700; color:#F6465D; margin-bottom:6px;">⚠️ RISK MANAGEMENT PARAMETERS</div>
                    <div style="font-size:12px; color:#848E9C; line-height:1.6;">
                        <div>• Daily Loss Limit: <strong style="color:#FFF;">₹200 max</strong></div>
                        <div>• Max Risk Per Trade: <strong style="color:#FFF;">₹100 max</strong></div>
                    </div>
                </div>
            `;

        } else if (currentTab === 'hist') {
            let h = `<div style="font-weight:700; margin-bottom:10px; font-size:13px;">📜 AUDIT TRAIL & HISTORY</div>`;
            if (db.history.length === 0) {
                h += `<div class="card" style="text-align:center; color:#848E9C; padding:30px;">No closed trade history available.</div>`;
            } else {
                db.history.forEach(log => {
                    h += `
                        <div class="card">
                            <div class="row">
                                <strong style="font-size:13px;">${log.sym}</strong>
                                <span class="${log.pnl >= 0 ? 'up' : 'down'}">${log.pnl >= 0 ? '+' : ''}₹${log.pnl}</span>
                            </div>
                            <div style="font-size:11px; color:#848E9C; margin-top:4px;">
                                Entry: ₹${log.inP} → Exit: ₹${log.outP} | Qty: ${log.qty}
                            </div>
                            <div style="font-size:10px; color:#F0B90B; margin-top:4px;">
                                Reason: ${log.reason} (${log.time})
                            </div>
                        </div>
                    `;
                });
            }
            box.innerHTML = h;
        }
    }
</script>
</body>
</html>
